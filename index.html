<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC DevSuite v3.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #02040a;
            --bg-panel: #0d1117;
            --bg-lighter: #161b22;
            --accent: #2f81f7;
            --accent-glow: rgba(47, 129, 247, 0.4);
            --border: #30363d;
            --text-dim: #8b949e;
            --text-bright: #c9d1d9;
            --mc-bg: rgba(0, 0, 0, 0.75);
        }

        * { box-sizing: border-box; outline: none; }
        body {
            margin: 0; background: var(--bg-deep); color: var(--text-bright);
            font-family: 'Inter', sans-serif; height: 100vh; display: flex; overflow: hidden;
        }

        /* --- SIDE NAVIGATION --- */
        nav {
            width: 70px; background: var(--bg-panel); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 15px;
        }
        .nav-item {
            width: 45px; height: 45px; background: var(--bg-lighter); border-radius: 10px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: 0.2s; border: 1px solid var(--border); font-size: 18px;
        }
        .nav-item:hover { border-color: var(--accent); color: var(--accent); }
        .nav-item.active { background: var(--accent); color: white; border: none; box-shadow: 0 0 15px var(--accent-glow); }

        /* --- LAYOUT --- */
        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        header {
            height: 60px; padding: 0 25px; display: flex; align-items: center;
            justify-content: space-between; background: var(--bg-panel); border-bottom: 1px solid var(--border);
        }
        .brand { font-weight: 600; letter-spacing: 1px; font-size: 18px; color: #fff; }
        .brand span { color: var(--accent); }

        .content { display: flex; flex: 1; overflow: hidden; }
        .view { display: none; width: 100%; height: 100%; overflow: hidden; }
        .view.active { display: flex; }

        /* --- GUI & TAB COMPONENTS --- */
        .sidebar { width: 320px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .scroll { flex: 1; overflow-y: auto; padding: 15px; }
        .canvas { flex: 1; background: var(--bg-deep); display: flex; flex-direction: column; align-items: center; padding: 40px; overflow-y: auto; }

        /* Minecraft Styles */
        .mc-font { font-family: 'JetBrains Mono', monospace; }
        .tab-preview-box {
            width: 800px; background: var(--mc-bg); border-radius: 4px; padding: 20px;
            text-align: center; color: white; border: 1px solid #444;
        }
        .tab-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 15px 0;
            text-align: left; font-size: 13px;
        }
        .tab-slot { background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 2px; }

        /* Item Grid */
        .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
        .lib-item {
            width: 38px; height: 38px; background: var(--bg-lighter); border: 1px solid var(--border);
            border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .lib-item:hover { border-color: var(--accent); }
        .lib-item img { width: 28px; height: 28px; image-rendering: pixelated; }

        /* Code & Inputs */
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 10px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; font-weight: 700; }
        input, textarea {
            width: 100%; background: var(--bg-deep); border: 1px solid var(--border);
            color: #fff; padding: 10px; border-radius: 6px; font-size: 13px;
        }
        .code-out {
            background: #000; padding: 15px; border-radius: 8px; font-family: 'JetBrains Mono';
            font-size: 11px; color: #7dd3fc; overflow: auto; border: 1px solid var(--border); white-space: pre;
        }
        .papi-item {
            background: var(--bg-lighter); padding: 8px; border-radius: 4px; margin-bottom: 5px;
            cursor: pointer; font-size: 12px; border: 1px solid transparent;
        }
        .papi-item:hover { border-color: var(--accent); }
        .papi-tag { color: var(--accent); font-weight: bold; }

        .btn {
            background: var(--accent); color: white; border: none; padding: 10px;
            border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%;
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-item active" onclick="setTab('gui')">🔲</div>
    <div class="nav-item" onclick="setTab('tab')">📑</div>
    <div class="nav-item" onclick="setTab('papi')">🧩</div>
</nav>

<main>
    <header>
        <div class="brand">MC<span>DEVSUITE</span> v3.0</div>
        <div id="status" style="font-size: 12px; color: var(--text-dim);">Ready</div>
    </header>

    <div class="content">
        <div id="view-gui" class="view active">
            <div class="sidebar">
                <div class="scroll">
                    <input type="text" id="item-search" placeholder="Search items..." oninput="drawLibrary()" style="margin-bottom: 15px;">
                    <div class="lib-grid" id="lib-items"></div>
                </div>
                <div style="padding:15px; border-top: 1px solid var(--border); background: var(--bg-lighter);">
                    <label>Selected Item</label>
                    <input type="text" id="slot-name" placeholder="Name (&bSword)" oninput="updateSlot()">
                    <textarea id="slot-lore" rows="3" style="margin-top:8px;" placeholder="Lore (Line by line)" oninput="updateSlot()"></textarea>
                </div>
            </div>
            <div class="canvas">
                <div style="background: #c6c6c6; padding: 10px; border: 3px solid #555; display: inline-block;">
                    <div id="gui-grid" style="display: grid; grid-template-columns: repeat(9, 40px); gap: 2px;"></div>
                </div>
                <div class="code-out" id="gui-code" style="width: 100%; margin-top: 30px; height: 250px;"></div>
            </div>
        </div>

        <div id="view-tab" class="view">
            <div class="sidebar">
                <div class="scroll">
                    <div class="input-group">
                        <label>Header</label>
                        <textarea id="tab-h-in" rows="4" oninput="updateTabPreview()">"&b&lServer Name", "&7Welcome &f%player%"</textarea>
                    </div>
                    <div class="input-group">
                        <label>Footer</label>
                        <textarea id="tab-f-in" rows="4" oninput="updateTabPreview()">"&eStore: shop.server.net", "&7Ping: &a%ping%ms"</textarea>
                    </div>
                </div>
            </div>
            <div class="canvas">
                <div class="tab-preview-box mc-font">
                    <div id="tab-header-prev"></div>
                    <div class="tab-grid" id="tab-slots-prev"></div>
                    <div id="tab-footer-prev"></div>
                </div>
                <div class="code-out" id="tab-code" style="width: 100%; margin-top: 30px;"></div>
            </div>
        </div>

        <div id="view-papi" class="view">
            <div class="sidebar" style="width: 100%;">
                <div class="scroll">
                    <input type="text" id="papi-search" placeholder="Search Placeholders (e.g. vault, player, ping)..." oninput="drawPapi()" style="margin-bottom: 20px;">
                    <div id="papi-list" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;"></div>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    // --- DATABASE & ASSETS ---
    const ITEMS = [
        'diamond_sword','diamond_pickaxe','netherite_axe','trident','mace','elytra','totem_of_undying','golden_apple','ender_pearl','tnt','experience_bottle',
        'grass_block','cobblestone','oak_log','glass','chest','crafting_table','furnace','beacon','shulker_box','trial_key','heavy_core','wind_charge',
        'white_wool','red_wool','blue_wool','iron_ingot','gold_ingot','emerald','diamond','netherite_scrap','paper','book','enchanted_book'
    ]; // In a real app, you could fetch the full 1.21 JSON list here.

    const PAPI = [
        {tag: "%player_name%", desc: "The player's username"},
        {tag: "%player_health%", desc: "Current health value"},
        {tag: "%vault_eco_balance_fixed%", desc: "Economy balance rounded"},
        {tag: "%server_tps_1%", desc: "Server TPS (1 min average)"},
        {tag: "%server_online%", desc: "Count of online players"},
        {tag: "%rel_factionsuuid_relation_color%", desc: "Factions relation color"}
    ];

    let state = {
        gui: {}, 
        selected: 0,
        brush: 'diamond_sword'
    };

    // --- UTILS ---
    function setTab(t) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('view-'+t).classList.add('active');
        event.currentTarget.classList.add('active');
        if(t === 'tab') updateTabPreview();
        if(t === 'papi') drawPapi();
    }

    function mcColor(text) {
        if(!text) return '';
        const colors = {
            '0':'#000000','1':'#0000AA','2':'#00AA00','3':'#00AAAA','4':'#AA0000','5':'#AA00AA','6':'#FFAA00','7':'#AAAAAA',
            '8':'#555555','9':'#5555FF','a':'#55FF55','b':'#55FFFF','c':'#FF5555','d':'#FF55FF','e':'#FFFF55','f':'#FFFFFF'
        };
        return text.replace(/&([0-9a-f])/g, (m, c) => `</span><span style="color:${colors[c]}">`) + '</span>';
    }

    // --- GUI LOGIC ---
    function drawLibrary() {
        const container = document.getElementById('lib-items');
        const filter = document.getElementById('item-search').value.toLowerCase();
        container.innerHTML = '';
        ITEMS.filter(i => i.includes(filter)).forEach(id => {
            const div = document.createElement('div');
            div.className = 'lib-item';
            // Logic to handle item vs block folder
            const img = document.createElement('img');
            img.src = `https://assets.mcasset.cloud/1.21/assets/minecraft/textures/item/${id}.png`;
            img.onerror = () => { img.src = `https://assets.mcasset.cloud/1.21/assets/minecraft/textures/block/${id}.png`; };
            div.appendChild(img);
            div.onclick = () => { state.brush = id; updateSlot(); };
            container.appendChild(div);
        });
    }

    function drawGrid() {
        const grid = document.getElementById('gui-grid');
        grid.innerHTML = '';
        for(let i=0; i<54; i++) {
            const slot = document.createElement('div');
            slot.style = "width:36px; height:36px; background:#8b8b8b; border:2px solid; border-color:#373737 #fff #fff #373737; display:flex; align-items:center; justify-content:center; cursor:pointer;";
            if(state.gui[i]) {
                const img = document.createElement('img');
                img.src = `https://assets.mcasset.cloud/1.21/assets/minecraft/textures/item/${state.gui[i].id}.png`;
                img.onerror = () => { img.src = `https://assets.mcasset.cloud/1.21/assets/minecraft/textures/block/${state.gui[i].id}.png`; };
                img.style = "width:28px; height:28px; image-rendering:pixelated;";
                slot.appendChild(img);
            }
            slot.onclick = () => {
                state.selected = i;
                if(!state.gui[i]) state.gui[i] = {id: state.brush, name: '', lore: ''};
                document.getElementById('slot-name').value = state.gui[i].name;
                document.getElementById('slot-lore').value = state.gui[i].lore;
                updateGuiCode();
                drawGrid();
            };
            grid.appendChild(slot);
        }
    }

    function updateSlot() {
        if(state.gui[state.selected]) {
            state.gui[state.selected].id = state.brush;
            state.gui[state.selected].name = document.getElementById('slot-name').value;
            state.gui[state.selected].lore = document.getElementById('slot-lore').value;
        }
        drawGrid();
        updateGuiCode();
    }

    function updateGuiCode() {
        let code = `public void openMenu(Player player) {\n    Inventory inv = Bukkit.createInventory(null, 54, "Custom Menu");\n\n`;
        Object.keys(state.gui).forEach(s => {
            const it = state.gui[s];
            code += `    ItemStack i${s} = new ItemStack(Material.${it.id.toUpperCase()});\n`;
            code += `    ItemMeta m${s} = i${s}.getItemMeta();\n`;
            if(it.name) code += `    m${s}.setDisplayName("${it.name.replace(/&/g, '§')}");\n`;
            if(it.lore) code += `    m${s}.setLore(Arrays.asList(${it.lore.split('\n').map(l=>`"${l.replace(/&/g,'§')}"`).join(',')}));\n`;
            code += `    i${s}.setItemMeta(m${s});\n    inv.setItem(${s}, i${s});\n\n`;
        });
        code += `    player.openInventory(inv);\n}`;
        document.getElementById('gui-code').innerText = code;
    }

    // --- TAB LOGIC ---
    function updateTabPreview() {
        const h = document.getElementById('tab-h-in').value;
        const f = document.getElementById('tab-f-in').value;
        
        document.getElementById('tab-header-prev').innerHTML = h.split(',').map(l => `<div>${mcColor(l.replace(/"/g,''))}</div>`).join('');
        document.getElementById('tab-footer-prev').innerHTML = f.split(',').map(l => `<div>${mcColor(l.replace(/"/g,''))}</div>`).join('');
        
        const grid = document.getElementById('tab-slots-prev');
        grid.innerHTML = '';
        for(let i=0; i<20; i++) {
            const slot = document.createElement('div');
            slot.className = 'tab-slot';
            slot.innerHTML = `<span style="color:#aaa">[Player]</span> User_${i+1}`;
            grid.appendChild(slot);
        }

        document.getElementById('tab-code').innerText = `header:\n  - ${h.split('\n').join('\n  - ')}\nfooter:\n  - ${f.split('\n').join('\n  - ')}`;
    }

    // --- PAPI LOGIC ---
    function drawPapi() {
        const container = document.getElementById('papi-list');
        const filter = document.getElementById('papi-search').value.toLowerCase();
        container.innerHTML = '';
        PAPI.filter(p => p.tag.includes(filter) || p.desc.toLowerCase().includes(filter)).forEach(p => {
            const div = document.createElement('div');
            div.className = 'papi-item';
            div.innerHTML = `<div class="papi-tag">${p.tag}</div><div style="font-size:10px; color:#888">${p.desc}</div>`;
            div.onclick = () => { navigator.clipboard.writeText(p.tag); alert('Copied Placeholder!'); };
            container.appendChild(div);
        });
    }

    drawLibrary();
    drawGrid();
</script>
</body>
</html>
