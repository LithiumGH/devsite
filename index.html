<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>End-Tier GUI Architect</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian: #0d0714;
            --amethyst: #9966cc;
            --void-purp: #2d1b4d;
            --end-rod: #e0d0f0;
            --mc-gui: #c6c6c6;
            --mc-border-dark: #373737;
            --mc-border-light: #ffffff;
        }

        body {
            background: var(--obsidian);
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            padding: 20px;
        }

        h1 { font-family: 'Press Start 2P', cursive; color: var(--amethyst); text-align: center; font-size: 22px; margin-bottom: 30px; }

        .editor-container {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Side Panels */
        .panel {
            background: var(--void-purp);
            border: 2px solid var(--amethyst);
            padding: 15px;
            border-radius: 4px;
            height: fit-content;
        }

        .panel-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            margin-bottom: 15px;
            color: var(--end-rod);
            border-bottom: 1px solid var(--amethyst);
            padding-bottom: 5px;
        }

        /* The Grid */
        .gui-canvas-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #gui-grid {
            display: grid;
            grid-template-columns: repeat(9, 50px);
            gap: 2px;
            background: var(--mc-gui);
            padding: 10px;
            border: 4px solid var(--mc-border-dark);
            image-rendering: pixelated;
        }

        .gui-slot {
            width: 50px;
            height: 50px;
            background: #8b8b8b;
            border: 2px solid;
            border-color: var(--mc-border-dark) var(--mc-border-light) var(--mc-border-light) var(--mc-border-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .gui-slot.selected {
            outline: 3px solid var(--amethyst);
            z-index: 10;
        }

        /* Item Palette */
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            max-height: 400px;
            overflow-y: auto;
        }

        .palette-item {
            width: 100%;
            aspect-ratio: 1;
            background: #333;
            border: 1px solid var(--amethyst);
            cursor: pointer;
            display: flex;
            font-size: 10px;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Inputs */
        input, textarea, select {
            width: 100%;
            background: #000;
            border: 1px solid var(--amethyst);
            color: var(--end-rod);
            padding: 8px;
            margin-bottom: 10px;
            font-family: inherit;
        }

        .export-box {
            grid-column: 1 / -1;
            background: #000;
            border: 2px solid var(--amethyst);
            padding: 20px;
            margin-top: 20px;
        }

        code { color: #d19a66; }
        .keyword { color: #c678dd; }
        .string { color: #98c379; }

        button {
            background: var(--amethyst);
            border: none;
            color: white;
            padding: 10px;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

<h1>GUI Architect v1</h1>

<div class="editor-container">
    
    <div class="panel">
        <div class="panel-title">Item Palette</div>
        <div class="palette-grid" id="palette">
            <div class="palette-item" onclick="setBrush('DIAMOND')">DIAMOND</div>
            <div class="palette-item" onclick="setBrush('GOLD_INGOT')">GOLD</div>
            <div class="palette-item" onclick="setBrush('IRON_INGOT')">IRON</div>
            <div class="palette-item" onclick="setBrush('CHEST')">CHEST</div>
            <div class="palette-item" onclick="setBrush('NETHERITE_SWORD')">SWORD</div>
            <div class="palette-item" onclick="setBrush('ENCHANTED_BOOK')">BOOK</div>
            <div class="palette-item" onclick="setBrush('BARRIER')">EXIT</div>
            <div class="palette-item" onclick="setBrush('GRAY_STAINED_GLASS_PANE')">PANEL</div>
        </div>
        <p style="font-size: 10px; margin-top: 10px;">Selected Brush: <span id="current-brush" style="color:var(--amethyst)">AIR</span></p>
    </div>

    <div class="gui-canvas-wrapper">
        <input type="text" id="gui-name" value="Custom Menu" style="width: 468px; text-align: center; font-size: 18px;">
        <div id="gui-grid"></div>
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button onclick="resizeGrid(27)">3 Rows</button>
            <button onclick="resizeGrid(54)">6 Rows</button>
        </div>
    </div>

    <div class="panel">
        <div class="panel-title">Item Meta</div>
        <label style="font-size: 10px;">Display Name</label>
        <input type="text" id="item-name" placeholder="§6Special Item" oninput="updateItemMeta()">
        <label style="font-size: 10px;">Lore (One per line)</label>
        <textarea id="item-lore" rows="5" placeholder="Line 1&#10;Line 2" oninput="updateItemMeta()"></textarea>
        <button onclick="clearSlot()">Clear Slot</button>
    </div>

    <div class="export-box">
        <div class="panel-title">Generated Spigot Code</div>
        <pre id="code-output"><code>// Your code will appear here...</code></pre>
        <button onclick="copyCode()">Copy to Clipboard</button>
    </div>

</div>

<script>
    let currentBrush = 'AIR';
    let selectedSlot = null;
    let inventoryData = {}; // Stores meta by slot index

    function initGrid(size) {
        const grid = document.getElementById('gui-grid');
        grid.innerHTML = '';
        grid.style.gridTemplateColumns = `repeat(9, 50px)`;
        
        for (let i = 0; i < size; i++) {
            const slot = document.createElement('div');
            slot.className = 'gui-slot';
            slot.dataset.index = i;
            slot.onclick = () => handleSlotClick(i);
            grid.appendChild(slot);
        }
        generateCode();
    }

    function setBrush(material) {
        currentBrush = material;
        document.getElementById('current-brush').innerText = material;
    }

    function handleSlotClick(index) {
        const slots = document.querySelectorAll('.gui-slot');
        slots.forEach(s => s.classList.remove('selected'));
        
        const slot = slots[index];
        slot.classList.add('selected');
        selectedSlot = index;

        // Apply Brush
        if (currentBrush !== 'AIR') {
            if (!inventoryData[index]) inventoryData[index] = { material: currentBrush, name: '', lore: '' };
            inventoryData[index].material = currentBrush;
            slot.innerText = currentBrush.substring(0, 4); // Visual shortcut
        }

        // Load Meta into Inputs
        const data = inventoryData[index] || { material: 'AIR', name: '', lore: '' };
        document.getElementById('item-name').value = data.name;
        document.getElementById('item-lore').value = data.lore;
        
        generateCode();
    }

    function updateItemMeta() {
        if (selectedSlot === null) return;
        if (!inventoryData[selectedSlot]) return;

        inventoryData[selectedSlot].name = document.getElementById('item-name').value;
        inventoryData[selectedSlot].lore = document.getElementById('item-lore').value;
        generateCode();
    }

    function clearSlot() {
        if (selectedSlot === null) return;
        delete inventoryData[selectedSlot];
        document.querySelectorAll('.gui-slot')[selectedSlot].innerText = '';
        generateCode();
    }

    function generateCode() {
        const title = document.getElementById('gui-name').value;
        const size = document.querySelectorAll('.gui-slot').length;
        let code = `<span class="keyword">public void</span> openGui(Player player) {\n`;
        code += `    Inventory inv = Bukkit.createInventory(<span class="keyword">null</span>, ${size}, <span class="string">"${title}"</span>);\n\n`;

        for (const [slot, data] of Object.entries(inventoryData)) {
            code += `    <span class="comment">// Slot ${slot}</span>\n`;
            code += `    ItemStack item${slot} = <span class="keyword">new</span> ItemStack(Material.${data.material});\n`;
            code += `    ItemMeta meta${slot} = item${slot}.getItemMeta();\n`;
            
            if (data.name) {
                code += `    meta${slot}.setDisplayName(<span class="string">"${data.name.replace(/&/g, '§')}"</span>);\n`;
            }
            if (data.lore) {
                const loreLines = data.lore.split('\n').map(l => `"<span class="string">${l.replace(/&/g, '§')}</span>"`).join(', ');
                code += `    meta${slot}.setLore(Arrays.asList(${loreLines}));\n`;
            }
            
            code += `    item${slot}.setItemMeta(meta${slot});\n`;
            code += `    inv.setItem(${slot}, item${slot});\n\n`;
        }

        code += `    player.openInventory(inv);\n}`;
        document.getElementById('code-output').innerHTML = `<code>${code}</code>`;
    }

    function resizeGrid(size) {
        inventoryData = {};
        initGrid(size);
    }

    function copyCode() {
        const text = document.getElementById('code-output').innerText;
        navigator.clipboard.writeText(text);
        alert("Java code copied!");
    }

    // Start
    initGrid(27);
</script>

</body>
</html>
