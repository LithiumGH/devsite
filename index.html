<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC DevSuite v5.0 | Omega</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030712;
            --bg-panel: #111827;
            --bg-lighter: #1f2937;
            --accent: #6366f1;
            --border: #374151;
            --text-dim: #9ca3af;
            --text-bright: #f3f4f6;
            /* MC Colors */
            --mc-0: #000; --mc-1: #0000AA; --mc-2: #00AA00; --mc-3: #00AAAA;
            --mc-4: #AA0000; --mc-5: #AA00AA; --mc-6: #FFAA00; --mc-7: #AAAAAA;
            --mc-8: #555555; --mc-9: #5555FF; --mc-a: #55FF55; --mc-b: #55FFFF;
            --mc-c: #FF5555; --mc-d: #FF55FF; --mc-e: #FFFF55; --mc-f: #FFFFFF;
        }

        * { box-sizing: border-box; outline: none; }
        body {
            margin: 0; background: var(--bg-deep); color: var(--text-bright);
            font-family: 'Inter', sans-serif; height: 100vh; display: flex; overflow: hidden;
        }

        /* --- NAVIGATION --- */
        nav {
            width: 75px; background: #000; border-right: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; padding: 25px 0; gap: 20px;
        }
        .nav-item {
            width: 50px; height: 50px; background: var(--bg-panel); border-radius: 12px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: 0.3s; border: 1px solid var(--border); font-size: 20px;
        }
        .nav-item:hover { border-color: var(--accent); transform: scale(1.05); }
        .nav-item.active { background: var(--accent); color: white; border: none; box-shadow: 0 0 20px rgba(99, 102, 241, 0.5); }

        /* --- STRUCTURE --- */
        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        header {
            height: 65px; padding: 0 30px; display: flex; align-items: center;
            justify-content: space-between; background: var(--bg-panel); border-bottom: 1px solid var(--border);
        }
        .brand { font-weight: 600; letter-spacing: 2px; font-size: 20px; }
        .brand span { color: var(--accent); }

        .container { display: flex; flex: 1; overflow: hidden; }
        .view { display: none; width: 100%; height: 100%; overflow: hidden; }
        .view.active { display: flex; }

        .sidebar { width: 340px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .scroll { flex: 1; overflow-y: auto; padding: 20px; }
        .canvas { flex: 1; background: var(--bg-deep); display: flex; flex-direction: column; align-items: center; padding: 30px; overflow-y: auto; }

        /* --- GUI EDITOR --- */
        .lib-cat-title { font-size: 10px; font-weight: 800; color: var(--accent); text-transform: uppercase; margin: 15px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
        .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 8px; }
        .lib-item {
            width: 40px; height: 40px; background: var(--bg-lighter); border: 1px solid var(--border);
            border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .lib-item:hover { border-color: var(--accent); background: var(--bg-deep); }
        .lib-item img { width: 30px; height: 30px; image-rendering: pixelated; }

        .inv-slot {
            width: 42px; height: 42px; background: #8b8b8b; border: 3px solid;
            border-color: #373737 #fff #fff #373737; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
        }
        .inv-slot.selected { border-color: var(--accent) !important; box-shadow: 0 0 15px var(--accent); z-index: 5; }

        /* --- PREVIEWS --- */
        .mc-ui { background: rgba(0,0,0,0.85); border: 2px solid #333; padding: 20px; font-family: 'JetBrains Mono', monospace; width: 100%; max-width: 750px; }
        .tab-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 20px 0; }
        .tab-player { background: rgba(255,255,255,0.05); padding: 5px 10px; border-radius: 2px; font-size: 12px; border-left: 3px solid var(--mc-a); }

        /* --- INPUTS --- */
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 6px; font-weight: 700; }
        input, textarea, select {
            width: 100%; background: var(--bg-deep); border: 1px solid var(--border);
            color: #fff; padding: 12px; border-radius: 8px; font-size: 13px; transition: 0.2s;
        }
        input:focus { border-color: var(--accent); }
        .code-box {
            background: #000; padding: 20px; border-radius: 10px; font-family: 'JetBrains Mono';
            font-size: 11px; color: #a5b4fc; overflow: auto; border: 1px solid var(--border); white-space: pre; width: 100%;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

<nav>
    <div class="nav-item active" onclick="setView('gui')" title="GUI Maker">🔲</div>
    <div class="nav-item" onclick="setView('tab')" title="TAB & Scoreboard">📋</div>
    <div class="nav-item" onclick="setView('motd')" title="MOTD Creator">📡</div>
    <div class="nav-item" onclick="setView('papi')" title="Placeholders">🧩</div>
</nav>

<main>
    <header>
        <div class="brand">MC<span>DEVSUITE</span> 5.0</div>
        <div id="hint-text" style="color: var(--text-dim); font-size: 12px;">Active Module: GUI Architect</div>
    </header>

    <div class="container">
        <div id="view-gui" class="view active">
            <div class="sidebar">
                <div class="scroll">
                    <input type="text" id="gui-search" placeholder="Search 1,000+ items..." oninput="renderLibrary()">
                    <div id="library-content"></div>
                </div>
                <div style="padding: 20px; background: var(--bg-lighter); border-top: 1px solid var(--border);">
                    <label>Item Name</label>
                    <input type="text" id="item-name" placeholder="&bMagic Sword" oninput="saveItem()">
                    <label style="margin-top:10px">Item Lore</label>
                    <textarea id="item-lore" rows="4" placeholder="&7First Line&#10;&7Second Line" oninput="saveItem()"></textarea>
                </div>
            </div>
            <div class="canvas">
                <div style="background: #c6c6c6; padding: 12px; border: 5px solid #555; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
                    <div id="gui-grid" style="display: grid; grid-template-columns: repeat(9, 42px); gap: 2px;"></div>
                </div>
                <div class="code-box" id="gui-code" style="margin-top: 30px; max-height: 300px;"></div>
            </div>
        </div>

        <div id="view-tab" class="view">
            <div class="sidebar">
                <div class="scroll">
                    <label>Header Lines</label>
                    <textarea id="tab-header-in" rows="5" oninput="updateTabPreview()">"&b&lSERVER NETWORK", " ", "&7Welcome, &f%player_name%!"</textarea>
                    <label style="margin-top:20px">Footer Lines</label>
                    <textarea id="tab-footer-in" rows="5" oninput="updateTabPreview()">"&eStore: shop.myserver.net", "&bDiscord: dsc.gg/myserver"</textarea>
                </div>
            </div>
            <div class="canvas">
                <div class="mc-ui">
                    <div id="tab-prev-header" style="text-align:center"></div>
                    <div class="tab-grid" id="tab-prev-list"></div>
                    <div id="tab-prev-footer" style="text-align:center"></div>
                </div>
                <div class="code-box" id="tab-code" style="margin-top: 25px;"></div>
            </div>
        </div>

        <div id="view-motd" class="view">
            <div class="sidebar">
                <div class="scroll">
                    <label>MOTD Line 1</label>
                    <input type="text" id="motd-l1" value="&b&lMy Minecraft Server &r&7[1.21]" oninput="updateMOTD()">
                    <label style="margin-top:20px">MOTD Line 2</label>
                    <input type="text" id="motd-l2" value="&e▶ &fJoin our &6&nOminous Trials&r &fnow!" oninput="updateMOTD()">
                </div>
            </div>
            <div class="canvas">
                <div class="mc-ui" style="display:flex; gap:15px; align-items:center; max-width: 650px;">
                    <div style="width:64px; height:64px; background:#222; border:1px solid #444; flex-shrink:0;"></div>
                    <div id="motd-preview-text" style="flex:1; font-size:16px; line-height:1.4;"></div>
                    <div style="color:#555; text-align:right">5/100<br><span style="color:#0a0">●●●●●</span></div>
                </div>
                <div class="code-box" id="motd-code" style="margin-top:30px;"></div>
            </div>
        </div>

        <div id="view-papi" class="view">
            <div class="sidebar" style="width: 100%;">
                <div class="scroll">
                    <input type="text" id="papi-search" placeholder="Filter placeholders (e.g. economy, faction, player)..." oninput="renderPapi()">
                    <div id="papi-results" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:12px; margin-top:20px;"></div>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    // --- DATABASE: EVERY ITEM CATEGORY ---
    const CATEGORIES = {
        "Combat": ['netherite_sword','diamond_sword','trident','mace','bow','crossbow','netherite_axe','shield','elytra','netherite_helmet','netherite_chestplate','netherite_leggings','netherite_boots','turtle_helmet','arrow'],
        "Tools": ['netherite_pickaxe','netherite_shovel','netherite_hoe','flint_and_steel','fishing_rod','shears','brush','spyglass','compass','recovery_compass','clock'],
        "Blocks": ['grass_block','cobblestone','oak_log','oak_planks','glass','stone_bricks','bookshelf','crafting_table','furnace','chest','barrel','shulker_box','beacon','conduit','obsidian','crying_obsidian'],
        "Redstone": ['redstone','redstone_torch','repeater','comparator','piston','sticky_piston','observer','dispenser','dropper','lever','stone_button','tripwire_hook','tnt'],
        "1.21 Trial": ['trial_key','ominous_trial_key','trial_spawner','vault','heavy_core','breeze_rod','wind_charge','bogged_spawn_egg'],
        "Valuables": ['diamond','emerald','netherite_ingot','gold_ingot','iron_ingot','amethyst_shard','echo_shard','totem_of_undying','enchanted_golden_apple','experience_bottle']
    };

    const PAPI = [
        {t: "%player_name%", d: "Player's name"}, {t: "%player_health%", d: "Current HP"},
        {t: "%vault_eco_balance_fixed%", d: "Vault Money"}, {t: "%server_tps_1%", d: "Server TPS"},
        {t: "%player_ping%", d: "Latency"}, {t: "%server_online%", d: "Online count"},
        {t: "%statistic_player_kills%", d: "Total Kills"}, {t: "%essentials_nickname%", d: "Essentials Nick"}
    ];

    // --- STATE ---
    let state = {
        brush: 'diamond_sword',
        selected: 0,
        gui: {}, // slot: {id, name, lore}
        view: 'gui'
    };

    // --- MC FORMATTING (THE FIX) ---
    function mcFormat(text) {
        if (!text) return "";
        const codes = {
            '0':'#000000','1':'#0000AA','2':'#00AA00','3':'#00AAAA','4':'#AA0000','5':'#AA00AA','6':'#FFAA00','7':'#AAAAAA',
            '8':'#555555','9':'#5555FF','a':'#55FF55','b':'#55FFFF','c':'#FF5555','d':'#FF55FF','e':'#FFFF55','f':'#FFFFFF'
        };
        const styles = { 'l': 'font-weight:bold', 'o': 'font-style:italic', 'n': 'text-decoration:underline', 'm': 'text-decoration:line-through' };
        
        let html = "";
        let activeStyles = new Set();
        let activeColor = "#fff";
        let parts = text.split(/&([0-9a-fklmnor])/g);

        for (let i = 0; i < parts.length; i++) {
            if (i % 2 === 1) {
                let code = parts[i].toLowerCase();
                if (code === 'r') { activeStyles.clear(); activeColor = "#fff"; }
                else if (codes[code]) { activeColor = codes[code]; activeStyles.clear(); }
                else if (styles[code]) { activeStyles.add(styles[code]); }
            } else {
                let styleStr = Array.from(activeStyles).join(';');
                html += `<span style="color:${activeColor};${styleStr}">${parts[i]}</span>`;
            }
        }
        return html;
    }

    // --- NAVIGATION ---
    function setView(v) {
        document.querySelectorAll('.view, .nav-item').forEach(e => e.classList.remove('active'));
        document.getElementById('view-'+v).classList.add('active');
        event.currentTarget.classList.add('active');
        state.view = v;
        if(v === 'tab') updateTabPreview();
        if(v === 'motd') updateMOTD();
        if(v === 'papi') renderPapi();
    }

    // --- GUI ENGINE ---
    function renderLibrary() {
        const container = document.getElementById('library-content');
        const filter = document.getElementById('gui-search').value.toLowerCase();
        container.innerHTML = '';

        for (const [cat, items] of Object.entries(CATEGORIES)) {
            const filtered = items.filter(i => i.includes(filter));
            if (filtered.length === 0) continue;

            container.innerHTML += `<div class="lib-cat-title">${cat}</div>`;
            const grid = document.createElement('div');
            grid.className = 'lib-grid';
            filtered.forEach(id => {
                const item = document.createElement('div');
                item.className = 'lib-item';
                item.innerHTML = `<img src="https://assets.mcasset.cloud/1.21/assets/minecraft/textures/item/${id}.png" onerror="this.src='https://assets.mcasset.cloud/1.21/assets/minecraft/textures/block/${id}.png'; this.onerror=null;">`;
                item.onclick = () => { state.brush = id; saveItem(); };
                grid.appendChild(item);
            });
            container.appendChild(grid);
        }
    }

    function renderGrid() {
        const grid = document.getElementById('gui-grid');
        grid.innerHTML = '';
        for (let i = 0; i < 54; i++) {
            const slot = document.createElement('div');
            slot.className = `inv-slot ${state.selected === i ? 'selected' : ''}`;
            if (state.gui[i]) {
                slot.innerHTML = `<img src="https://assets.mcasset.cloud/1.21/assets/minecraft/textures/item/${state.gui[i].id}.png" onerror="this.src='https://assets.mcasset.cloud/1.21/assets/minecraft/textures/block/${state.gui[i].id}.png'; this.onerror=null;" style="width:32px; image-rendering:pixelated">`;
            }
            slot.onclick = () => {
                state.selected = i;
                if (!state.gui[i]) state.gui[i] = { id: state.brush, name: '', lore: '' };
                document.getElementById('item-name').value = state.gui[i].name;
                document.getElementById('item-lore').value = state.gui[i].lore;
                renderGrid();
                updateGuiCode();
            };
            grid.appendChild(slot);
        }
    }

    function saveItem() {
        if (!state.gui[state.selected]) state.gui[state.selected] = { id: state.brush, name: '', lore: '' };
        state.gui[state.selected].id = state.brush;
        state.gui[state.selected].name = document.getElementById('item-name').value;
        state.gui[state.selected].lore = document.getElementById('item-lore').value;
        renderGrid();
        updateGuiCode();
    }

    function updateGuiCode() {
        let code = `public void openMenu(Player player) {\n    Inventory inv = Bukkit.createInventory(null, 54, "Server Menu");\n`;
        Object.keys(state.gui).forEach(s => {
            const it = state.gui[s];
            code += `\n    ItemStack i${s} = new ItemStack(Material.${it.id.toUpperCase()});\n    ItemMeta m${s} = i${s}.getItemMeta();`;
            if (it.name) code += `\n    m${s}.setDisplayName("${it.name.replace(/&/g, '§')}");`;
            if (it.lore) code += `\n    m${s}.setLore(Arrays.asList(${it.lore.split('\n').map(l => `"${l.replace(/&/g, '§')}"`).join(', ')}));`;
            code += `\n    i${s}.setItemMeta(m${s});\n    inv.setItem(${s}, i${s});`;
        });
        code += `\n\n    player.openInventory(inv);\n}`;
        document.getElementById('gui-code').innerText = code;
    }

    // --- TAB & MOTD ENGINE ---
    function updateTabPreview() {
        const h = document.getElementById('tab-header-in').value;
        const f = document.getElementById('tab-footer-in').value;
        document.getElementById('tab-prev-header').innerHTML = h.split(',').map(l => `<div>${mcFormat(l.replace(/"/g,''))}</div>`).join('');
        document.getElementById('tab-prev-footer').innerHTML = f.split(',').map(l => `<div>${mcFormat(l.replace(/"/g,''))}</div>`).join('');
        
        const list = document.getElementById('tab-prev-list');
        list.innerHTML = '';
        for(let i=1; i<=12; i++) list.innerHTML += `<div class="tab-player">${mcFormat('&7Player_'+i)}</div>`;
        
        document.getElementById('tab-code').innerText = `header-footer:\n  enabled: true\n  header:\n    - ${h.split('\n').join('\n    - ')}\n  footer:\n    - ${f.split('\n').join('\n    - ')}`;
    }

    function updateMOTD() {
        const l1 = document.getElementById('motd-l1').value;
        const l2 = document.getElementById('motd-l2').value;
        document.getElementById('motd-preview-text').innerHTML = mcFormat(l1) + "<br>" + mcFormat(l2);
        document.getElementById('motd-code').innerText = `motd=${l1}\\n${l2}`;
    }

    function renderPapi() {
        const container = document.getElementById('papi-results');
        const filter = document.getElementById('papi-search').value.toLowerCase();
        container.innerHTML = '';
        PAPI.filter(p => p.t.includes(filter) || p.d.toLowerCase().includes(filter)).forEach(p => {
            container.innerHTML += `<div style="background:var(--bg-lighter); padding:15px; border-radius:10px; border:1px solid var(--border); cursor:pointer" onclick="navigator.clipboard.writeText('${p.t}'); alert('Copied!')">
                <div style="color:var(--accent); font-weight:bold; font-family:monospace;">${p.t}</div>
                <div style="font-size:11px; color:var(--text-dim); margin-top:5px;">${p.d}</div>
            </div>`;
        });
    }

    // INIT
    renderLibrary();
    renderGrid();
</script>
</body>
</html>
