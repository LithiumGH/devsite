<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUI Architect v7 (Pro UI)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Theme Colors */
            --bg-app: #121212;
            --bg-panel: #181818;
            --bg-header: #1f1f1f;
            --border: #2a2a2a;
            --accent: #6366f1; /* Indigo */
            --accent-hover: #4f46e5;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --input-bg: #0f0f0f;
            
            /* Minecraft GUI Colors */
            --mc-bg: #c6c6c6;
            --mc-slot: #8b8b8b;
            --mc-light: #ffffff;
            --mc-dark: #373737;
        }

        * { box-sizing: border-box; outline: none; }
        
        body {
            margin: 0;
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevents whole page scroll */
        }

        /* --- HEADER --- */
        header {
            height: 50px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .brand {
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand span { color: var(--accent); }
        
        .status-bar {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-dim);
            background: rgba(255,255,255,0.05);
            padding: 4px 10px;
            border-radius: 4px;
        }

        /* --- MAIN LAYOUT --- */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden; /* Contains the panels */
        }

        .sidebar {
            width: 300px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 10;
        }
        .sidebar.right {
            width: 320px;
            border-right: none;
            border-left: 1px solid var(--border);
        }

        /* --- CANVAS (The Fix) --- */
        .canvas-area {
            flex: 1;
            background-color: #0f0f0f;
            background-image: radial-gradient(#2a2a2a 1px, transparent 1px);
            background-size: 20px 20px; /* Dot Grid Pattern */
            position: relative;
            overflow: auto; /* Allows scrolling ONLY inside canvas if GUI is too big */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        /* --- COMPONENTS --- */
        .panel-header {
            padding: 15px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Search */
        .search-container { padding: 10px; border-bottom: 1px solid var(--border); }
        .search-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            transition: 0.2s;
        }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }

        /* Item Grid in Sidebar */
        .library-grid {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-auto-rows: max-content;
            gap: 6px;
        }
        
        .lib-item {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.03);
            border-radius: 4px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid transparent;
            position: relative;
        }
        .lib-item:hover { background: rgba(255,255,255,0.1); border-color: #444; }
        .lib-item.active { border-color: var(--accent); background: rgba(99, 102, 241, 0.15); }
        .lib-item img { width: 32px; height: 32px; image-rendering: pixelated; pointer-events: none; }

        /* --- THE GUI FRAME --- */
        .gui-frame {
            background: var(--mc-bg);
            padding: 8px;
            border: 4px solid var(--mc-dark);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            margin: auto; /* Keeps it centered but allows scroll */
            position: relative;
        }

        .gui-grid {
            display: grid;
            grid-template-columns: repeat(9, 54px);
            gap: 4px; /* Accurate Gap */
        }

        /* Accurate MC Slot Styling */
        .slot {
            width: 54px; height: 54px;
            background: var(--mc-slot);
            /* The bevel effect */
            border-top: 2px solid var(--mc-dark);
            border-left: 2px solid var(--mc-dark);
            border-bottom: 2px solid var(--mc-light);
            border-right: 2px solid var(--mc-light);
            position: relative;
            cursor: pointer;
        }
        .slot:hover { background: #9c9c9c; }
        .slot.selected { position: relative; }
        .slot.selected::after {
            content: ''; position: absolute; inset: -2px;
            border: 3px solid var(--accent); z-index: 5;
        }

        .slot img {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 46px; height: 46px;
            image-rendering: pixelated;
            pointer-events: none;
        }

        /* --- PROPERTIES PANEL --- */
        .props-scroll { padding: 20px; overflow-y: auto; height: 100%; }
        .form-group { margin-bottom: 20px; }
        .label { display: block; font-size: 11px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; }
        
        input[type="text"], textarea {
            width: 100%; background: var(--input-bg); border: 1px solid var(--border);
            color: #fff; padding: 10px; border-radius: 4px;
            font-family: 'JetBrains Mono', monospace; font-size: 12px;
        }
        input:focus, textarea:focus { border-color: var(--accent); }

        .btn {
            width: 100%; padding: 12px; background: var(--accent);
            color: #fff; border: none; border-radius: 6px;
            font-weight: 600; cursor: pointer; transition: 0.2s;
            font-size: 13px;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn.secondary { background: #2a2a2a; margin-top: 10px; }
        .btn.secondary:hover { background: #333; }
        .btn.danger { background: #ef4444; color: white; }
        .btn.danger:hover { background: #dc2626; }

        /* Code Block */
        .code-preview {
            background: #0d0d0d; border: 1px solid var(--border);
            padding: 12px; border-radius: 4px; height: 150px;
            overflow: auto; font-family: 'JetBrains Mono', monospace;
            font-size: 11px; color: #a5b4fc; white-space: pre;
            margin-bottom: 10px;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-app); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        /* Fallback Icon */
        .fallback-icon {
            width: 32px; height: 32px; background: #333;
            color: #fff; border-radius: 4px; font-family: monospace;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 10px; text-shadow: 0 1px 2px black;
        }

        /* Tooltip */
        #tooltip {
            position: fixed; background: rgba(15, 23, 42, 0.95);
            border: 1px solid #334155; padding: 10px;
            border-radius: 6px; pointer-events: none; z-index: 1000;
            display: none; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            font-family: 'JetBrains Mono', monospace; min-width: 150px;
        }
    </style>
</head>
<body>

<header>
    <div class="brand">
        GUI <span>ARCHITECT</span> <small style="color:#555; font-size: 10px;">v7.0</small>
    </div>
    <div class="status-bar" id="status-bar">
        Drag Mode Active
    </div>
</header>

<div class="workspace">
    <div class="sidebar">
        <div class="panel-header">
            Item Library (1.21)
            <button onclick="setBrush(null)" style="background:transparent; border:none; color:var(--text-dim); cursor:pointer; font-size:10px;">[RESET]</button>
        </div>
        <div class="search-container">
            <input type="text" class="search-input" id="search" placeholder="Search item..." autocomplete="off">
        </div>
        <div class="library-grid" id="library">
            </div>
    </div>

    <div class="canvas-area">
        <input type="text" id="gui-title" value="Menu Title" 
               style="text-align: center; font-size: 20px; width: 400px; background: transparent; border: none; border-bottom: 2px solid var(--accent); margin-bottom: 30px; font-family: 'Inter'; font-weight: 600; padding: 10px;">
        
        <div class="gui-frame">
            <div class="gui-grid" id="grid">
                </div>
        </div>

        <div style="margin-top: 30px; display: flex; gap: 10px;">
            <button class="btn secondary" style="width: auto; padding: 8px 16px;" onclick="resize(27)">3 Rows</button>
            <button class="btn secondary" style="width: auto; padding: 8px 16px;" onclick="resize(54)">6 Rows</button>
        </div>
    </div>

    <div class="sidebar right">
        <div class="panel-header">Properties</div>
        <div class="props-scroll">
            
            <div class="form-group">
                <span class="label">Material</span>
                <input type="text" id="p-id" readonly style="opacity: 0.6; cursor: not-allowed;">
            </div>

            <div class="form-group">
                <span class="label">Display Name</span>
                <input type="text" id="p-name" placeholder="&bDiamond Sword" oninput="updateData()">
            </div>

            <div class="form-group">
                <span class="label">Lore</span>
                <textarea id="p-lore" rows="5" placeholder="&7Stats:&#10;&cDamage: 50" oninput="updateData()"></textarea>
            </div>

            <button class="btn danger" onclick="deleteSlot()">Remove Item</button>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">

            <div class="form-group">
                <span class="label">Java Code</span>
                <div class="code-preview" id="code"></div>
                <button class="btn" onclick="copyCode()">Copy Code</button>
            </div>
        </div>
    </div>
</div>

<div id="tooltip"></div>

<script>
    // --- 1. ASSETS & DATABASE ---
    const ASSET_BASE = "https://assets.mcasset.cloud/1.21/assets/minecraft/textures";
    
    // Quick Generator for 1.21 DB
    const DB = [];
    const add = (id) => DB.push(id);
    const variants = (base, list) => list.forEach(p => add(`${p}_${base}`));
    const colors = ['WHITE','ORANGE','MAGENTA','LIGHT_BLUE','YELLOW','LIME','PINK','GRAY','LIGHT_GRAY','CYAN','PURPLE','BLUE','BROWN','GREEN','RED','BLACK'];
    const woods = ['OAK','SPRUCE','BIRCH','JUNGLE','ACACIA','DARK_OAK','MANGROVE','CHERRY','BAMBOO','CRIMSON','WARPED'];

    // Add basics
    ['SWORD','PICKAXE','AXE','SHOVEL','HOE','HELMET','CHESTPLATE','LEGGINGS','BOOTS'].forEach(t => variants(t, ['WOODEN','STONE','IRON','GOLDEN','DIAMOND','NETHERITE']));
    variants('WOOL', colors); variants('STAINED_GLASS_PANE', colors); variants('CONCRETE', colors);
    variants('LOG', woods); variants('PLANKS', woods);
    ['COAL','IRON','COPPER','GOLD','REDSTONE','EMERALD','LAPIS','DIAMOND'].forEach(o => { add(`${o}_ORE`); if(!['COAL','REDSTONE'].includes(o)) add(`RAW_${o}`); });
    
    // 1.21 Specifics & Misc
    ['CRAFTER','TRIAL_KEY','OMINOUS_TRIAL_KEY','MACE','BREEZE_ROD','WIND_CHARGE','COPPER_BULB','TUFF','TUFF_BRICKS','CHISELED_TUFF','HEAVY_CORE',
     'BARRIER','STRUCTURE_VOID','LIGHT','COMMAND_BLOCK','APPLE','GOLDEN_APPLE','TOTEM_OF_UNDYING','ELYTRA','TNT',
     'ENDER_PEARL','BUCKET','WATER_BUCKET','LAVA_BUCKET','BOOK','PAPER','STICK','ARROW','BOW','CROSSBOW','TRIDENT','SHIELD'
    ].forEach(i => add(i));

    // --- 2. STATE ---
    let state = {
        grid: {},
        brush: null,
        selected: null,
        size: 54,
        isPainting: false,
        dragSrc: null
    };

    // --- 3. CORE FUNCTIONS ---

    // Smart Image Loader (Texture -> Block -> Text Fallback)
    function createVisual(id) {
        const name = id.toLowerCase();
        const wrap = document.createElement('div');
        wrap.style.width = '100%'; wrap.style.height = '100%'; 
        wrap.style.display = 'flex'; wrap.style.justifyContent = 'center'; wrap.style.alignItems = 'center';

        const img = document.createElement('img');
        
        // Path logic
        let path = `${ASSET_BASE}/item/${name}.png`;
        if(id.includes('BLOCK') || id.includes('ORE') || id.includes('LOG') || id.includes('PLANKS') || id.includes('WOOL')) {
            path = `${ASSET_BASE}/block/${name}.png`;
        }
        
        img.src = path;
        
        img.onerror = function() {
            if(this.src.includes('/item/')) {
                this.src = `${ASSET_BASE}/block/${name}.png`;
            } else {
                this.style.display = 'none';
                const fb = document.createElement('div');
                fb.className = 'fallback-icon';
                fb.innerText = id.substring(0,2);
                fb.style.backgroundColor = '#' + Math.floor(Math.random()*16777215).toString(16); // Random color for distinction
                wrap.appendChild(fb);
            }
        };

        wrap.appendChild(img);
        return wrap;
    }

    function renderLib(filter) {
        const lib = document.getElementById('library');
        lib.innerHTML = '';
        let c = 0;
        
        for(let id of DB) {
            if(filter && !id.includes(filter)) continue;
            if(!filter && c > 150) break; // Optimization cap

            const d = document.createElement('div');
            d.className = 'lib-item';
            if(state.brush === id) d.classList.add('active');
            d.onclick = () => setBrush(id);
            d.appendChild(createVisual(id));
            lib.appendChild(d);
            c++;
        }
    }

    function renderGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        
        for(let i=0; i<state.size; i++) {
            const slot = document.createElement('div');
            slot.className = 'slot';
            slot.dataset.idx = i;
            
            // Events
            slot.onmousedown = (e) => handleDown(e, i);
            slot.onmouseenter = (e) => handleEnter(e, i);
            slot.onmouseleave = () => document.getElementById('tooltip').style.display='none';
            
            // Drag Native
            slot.draggable = true;
            slot.ondragstart = (e) => onDragStart(e, i);
            slot.ondragover = (e) => { if(!state.brush) e.preventDefault(); };
            slot.ondrop = (e) => onDrop(e, i);

            // Existing Item
            if(state.grid[i]) slot.appendChild(createVisual(state.grid[i].id));

            grid.appendChild(slot);
        }
    }

    function updateSlotUI(i) {
        const slot = document.querySelector(`.slot[data-idx="${i}"]`);
        if(!slot) return;
        slot.innerHTML = '';
        if(state.grid[i]) slot.appendChild(createVisual(state.grid[i].id));
    }

    // --- 4. INTERACTION ---

    function setBrush(id) {
        state.brush = id;
        document.getElementById('status-bar').innerHTML = id ? 
            `Painting: <span style="color:var(--accent)">${id}</span>` : 
            `Mode: Drag & Select`;
        
        // Update visual active state in lib
        document.querySelectorAll('.lib-item').forEach(el => el.classList.remove('active'));
        if(id) renderLib(document.getElementById('search').value.toUpperCase()); // Refresh to show selection
    }

    function handleDown(e, i) {
        if(state.brush) {
            state.isPainting = true;
            paint(i);
        } else {
            select(i);
        }
    }

    function handleEnter(e, i) {
        if(state.grid[i]) showTooltip(e, state.grid[i]);
        if(state.isPainting && state.brush) paint(i);
    }

    function paint(i) {
        state.grid[i] = { id: state.brush, name: '', lore: '' };
        updateSlotUI(i);
        select(i);
        genJava();
    }

    // Drag Logic
    function onDragStart(e, i) {
        if(state.brush || !state.grid[i]) { e.preventDefault(); return; }
        state.dragSrc = i;
        document.getElementById('tooltip').style.display = 'none';
    }

    function onDrop(e, i) {
        e.preventDefault();
        if(state.dragSrc === null || state.brush) return;
        
        const src = state.grid[state.dragSrc];
        const dest = state.grid[i];
        
        state.grid[i] = src;
        if(dest) state.grid[state.dragSrc] = dest;
        else delete state.grid[state.dragSrc];

        updateSlotUI(i);
        updateSlotUI(state.dragSrc);
        state.dragSrc = null;
        select(i);
        genJava();
    }

    function select(i) {
        state.selected = i;
        document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
        if(i !== null) document.querySelector(`.slot[data-idx="${i}"]`)?.classList.add('selected');

        const d = i !== null ? state.grid[i] : null;
        document.getElementById('p-id').value = d ? d.id : '';
        document.getElementById('p-name').value = d ? d.name : '';
        document.getElementById('p-lore').value = d ? d.lore : '';
    }

    function updateData() {
        if(state.selected === null || !state.grid[state.selected]) return;
        state.grid[state.selected].name = document.getElementById('p-name').value;
        state.grid[state.selected].lore = document.getElementById('p-lore').value;
        genJava();
    }

    function deleteSlot() {
        if(state.selected !== null) {
            delete state.grid[state.selected];
            updateSlotUI(state.selected);
            select(null);
            genJava();
        }
    }

    function resize(s) {
        state.size = s;
        renderGrid();
        genJava();
    }

    // --- 5. TOOLTIP & CODE ---

    function showTooltip(e, d) {
        const tt = document.getElementById('tooltip');
        const color = (t) => t.replace(/&([0-9a-f])/g, '<span style="color:var(--accent)">$1</span>'); // Simplified preview color
        
        let html = `<div style="color:#fff; font-weight:bold">${d.name ? d.name : d.id}</div>`;
        if(d.lore) html += `<div style="color:#aaa; font-size:11px; margin-top:4px;">${d.lore.replace(/\n/g,'<br>')}</div>`;
        
        tt.innerHTML = html;
        tt.style.display = 'block';
        tt.style.left = (e.clientX + 15) + 'px';
        tt.style.top = (e.clientY + 15) + 'px';
    }

    function genJava() {
        const title = document.getElementById('gui-title').value;
        let c = `public void openGui(Player p) {\n    Inventory inv = Bukkit.createInventory(null, ${state.size}, "${title}");\n\n`;
        
        Object.keys(state.grid).forEach(k => {
            const item = state.grid[k];
            c += `    ItemStack i${k} = new ItemStack(Material.${item.id});\n`;
            c += `    ItemMeta m${k} = i${k}.getItemMeta();\n`;
            if(item.name) c += `    m${k}.setDisplayName("${item.name.replace(/&/g,'§')}");\n`;
            if(item.lore) c += `    m${k}.setLore(Arrays.asList(${item.lore.split('\n').map(l=>`"${l.replace(/&/g,'§')}"`).join(',')}));\n`;
            c += `    i${k}.setItemMeta(m${k});\n    inv.setItem(${k}, i${k});\n\n`;
        });
        
        c += `    p.openInventory(inv);\n}`;
        document.getElementById('code').innerText = c;
    }

    function copyCode() {
        navigator.clipboard.writeText(document.getElementById('code').innerText);
        alert("Code Copied!");
    }

    // Init
    window.addEventListener('mouseup', () => state.isPainting = false);
    document.getElementById('search').addEventListener('input', (e) => renderLib(e.target.value.toUpperCase()));
    renderLib('');
    renderGrid();
    genJava();

</script>
</body>
</html>
