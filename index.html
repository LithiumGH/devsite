<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUI Architect v4 (1.21 + Paint Mode)</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian: #0d0714;
            --amethyst: #9966cc;
            --void-purp: #2d1b4d;
            --end-rod: #e0d0f0;
            --mc-gui: #c6c6c6;
            --mc-border-dark: #373737;
            --mc-border-light: #ffffff;
            --tooltip-bg: rgba(16, 0, 16, 0.95);
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            background: radial-gradient(circle at center, #1a0f2e 0%, var(--obsidian) 100%);
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            padding: 20px;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* LAYOUT */
        .editor-container {
            display: grid;
            grid-template-columns: 320px 1fr 340px;
            gap: 20px;
            height: calc(100vh - 80px);
            max-width: 1800px;
            margin: 0 auto;
        }

        .panel {
            background: rgba(45, 27, 77, 0.9);
            border: 2px solid var(--amethyst);
            display: flex;
            flex-direction: column;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .panel-header {
            background: var(--amethyst);
            color: #000;
            padding: 10px;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            text-align: center;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-content { padding: 10px; overflow-y: auto; flex: 1; }

        /* ITEM PALETTE */
        .search-bar {
            width: 100%;
            background: #000;
            border: 1px solid var(--amethyst);
            color: #fff;
            padding: 10px;
            margin-bottom: 10px;
            font-family: inherit;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
            gap: 4px;
        }

        .palette-item {
            width: 100%;
            aspect-ratio: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .palette-item:hover { border-color: var(--end-rod); background: rgba(255,255,255,0.1); }
        .palette-item.active-brush { border-color: #00ff00; background: rgba(0,255,0,0.1); }
        .palette-item img { width: 32px; height: 32px; image-rendering: pixelated; pointer-events: none; }

        /* CANVAS */
        .canvas-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }

        .gui-frame {
            background: var(--mc-gui);
            padding: 10px;
            border: 4px solid var(--mc-border-dark);
            border-radius: 2px;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.6);
        }

        #gui-grid {
            display: grid;
            grid-template-columns: repeat(9, 54px);
            gap: 4px;
        }

        .gui-slot {
            width: 54px;
            height: 54px;
            background: #8b8b8b;
            border: 2px solid;
            border-color: #373737 #fff #fff #373737;
            position: relative;
            cursor: pointer;
        }

        .gui-slot:hover { background: #a0a0a0; }
        .gui-slot.selected { outline: 3px solid var(--amethyst); z-index: 10; }
        .gui-slot img {
            width: 44px;
            height: 44px;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            image-rendering: pixelated;
            pointer-events: none;
        }

        /* TOOLTIP */
        #mc-tooltip {
            position: fixed;
            background: var(--tooltip-bg);
            border: 2px solid #2a004e;
            padding: 8px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 9999;
            display: none;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            min-width: 150px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.4;
        }
        
        .mc-text { color: #fff; text-shadow: 1px 1px 0 #000; }

        /* PROPERTIES */
        label { display: block; margin: 10px 0 5px; font-size: 12px; color: var(--end-rod); }
        input, textarea {
            width: 100%; background: #111; border: 1px solid #555;
            color: #fff; padding: 8px; font-family: 'JetBrains Mono', monospace;
            user-select: text;
        }
        input:focus, textarea:focus { border-color: var(--amethyst); outline: none; }

        button {
            background: var(--amethyst); border: none; color: white;
            padding: 12px; width: 100%; cursor: pointer;
            font-family: 'Press Start 2P', cursive; font-size: 10px; margin-top: 10px;
        }
        button:hover { filter: brightness(1.2); }
        button.secondary { background: #555; }
        button.danger { background: #aa3333; }

        .code-preview {
            margin-top: 20px; background: #1e1e1e; padding: 10px;
            border-radius: 4px; font-size: 11px; height: 180px;
            overflow: auto; white-space: pre; color: #d4d4d4;
            border: 1px solid #333; user-select: text;
        }
        
        h1 { font-family: 'Press Start 2P'; color: var(--amethyst); text-align: center; margin-bottom: 20px; }
        
        /* Helper for the brush indicator */
        #brush-indicator {
            font-size: 10px; color: #aaa; margin-top: 10px; display: flex; align-items: center; gap: 10px;
        }
        #brush-img { width: 24px; height: 24px; display: none; image-rendering: pixelated; }

    </style>
</head>
<body>

<h1>GUI Architect v4 <span style="font-size:12px; color:#666;">// 1.21 Ready</span></h1>

<div class="editor-container">
    
    <div class="panel">
        <div class="panel-header">
            <span>Library</span>
            <button onclick="setBrush(null)" style="width: auto; padding: 5px 10px; margin:0; font-size: 8px;">CLEAR BRUSH</button>
        </div>
        <div class="panel-content">
            <input type="text" class="search-bar" placeholder="Search (e.g. glass, cherry, sword)" id="search-input" onkeyup="filterPalette()">
            <div class="palette-grid" id="palette-grid"></div>
        </div>
    </div>

    <div class="canvas-area">
        <input type="text" id="gui-title" value="My Menu" style="text-align: center; font-size: 20px; width: 300px; background: transparent; border: none; border-bottom: 2px solid var(--amethyst); margin-bottom: 20px;">
        
        <div class="gui-frame">
            <div id="gui-grid" onmouseleave="endPaint()"></div>
        </div>

        <div id="brush-indicator">
            Active Brush: <img id="brush-img" src=""> <span id="brush-name" style="color:var(--amethyst)">CURSOR (Drag Mode)</span>
        </div>
        
        <div style="display: flex; gap: 10px; width: 300px; margin-top: 10px;">
            <button class="secondary" onclick="setGridSize(27)">3 Rows</button>
            <button class="secondary" onclick="setGridSize(54)">6 Rows</button>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">Item Meta</div>
        <div class="panel-content">
            <label>Item Type</label>
            <input type="text" id="prop-mat" readonly style="color: #666; cursor: not-allowed;">

            <label>Display Name (Use & for colors)</label>
            <input type="text" id="prop-name" placeholder="&bExcalibur" oninput="updateSlotData()">

            <label>Lore</label>
            <textarea id="prop-lore" rows="6" placeholder="&7Type description..." oninput="updateSlotData()"></textarea>

            <button class="danger" onclick="clearSelectedSlot()">Delete Slot (Right Click)</button>

            <label style="margin-top: 20px;">Spigot/Paper Code</label>
            <div class="code-preview" id="code-output"></div>
            <button onclick="copyCode()">Copy Code</button>
        </div>
    </div>
</div>

<div id="mc-tooltip"></div>

<script>
    // --- 1. CONFIG & ASSETS ---
    const ASSET_BASE = "https://assets.mcasset.cloud/1.21/assets/minecraft/textures";
    
    // --- 2. GENERATE ITEM DATABASE ---
    // Helper to generate variants
    function genVariants(base, suffixes, type='block') {
        let items = [];
        suffixes.forEach(s => {
            let id = `${s}_${base}`.toUpperCase();
            let name = `${s}_${base}`.toLowerCase();
            items.push({ id: id, name: name, type: type });
        });
        return items;
    }

    const COLORS = ['WHITE','ORANGE','MAGENTA','LIGHT_BLUE','YELLOW','LIME','PINK','GRAY','LIGHT_GRAY','CYAN','PURPLE','BLUE','BROWN','GREEN','RED','BLACK'];
    const WOODS = ['OAK','SPRUCE','BIRCH','JUNGLE','ACACIA','DARK_OAK','MANGROVE','CHERRY','BAMBOO','CRIMSON','WARPED'];
    const ORES = ['COAL','IRON','COPPER','GOLD','REDSTONE','EMERALD','LAPIS','DIAMOND'];

    let DB = [
        // Tools & Combat
        { id: 'DIAMOND_SWORD', name: 'diamond_sword', type: 'item' },
        { id: 'NETHERITE_SWORD', name: 'netherite_sword', type: 'item' },
        { id: 'DIAMOND_PICKAXE', name: 'diamond_pickaxe', type: 'item' },
        { id: 'BOW', name: 'bow', type: 'item' },
        { id: 'ARROW', name: 'arrow', type: 'item' },
        { id: 'TOTEM_OF_UNDYING', name: 'totem_of_undying', type: 'item' },
        { id: 'TRIDENT', name: 'trident', type: 'item' },
        { id: 'SHIELD', name: 'shield', type: 'item' },

        // Common GUI Items
        { id: 'BARRIER', name: 'barrier', type: 'item' },
        { id: 'PAPER', name: 'paper', type: 'item' },
        { id: 'BOOK', name: 'book', type: 'item' },
        { id: 'WRITABLE_BOOK', name: 'writable_book', type: 'item' },
        { id: 'CHEST', name: 'chest_inventory', type: 'block', special: true },
        { id: 'ENDER_CHEST', name: 'ender_chest_inventory', type: 'block', special: true },
        
        // Misc
        { id: 'AMETHYST_SHARD', name: 'amethyst_shard', type: 'item' },
        { id: 'NETHER_STAR', name: 'nether_star', type: 'item' },
        { id: 'ENDER_PEARL', name: 'ender_pearl', type: 'item' },
        { id: 'GOLDEN_APPLE', name: 'golden_apple', type: 'item' },
        { id: 'EXPERIENCE_BOTTLE', name: 'experience_bottle', type: 'item' },
    ];

    // Add Variants
    DB = DB.concat(genVariants('STAINED_GLASS_PANE', COLORS, 'block'));
    DB = DB.concat(genVariants('WOOL', COLORS, 'block'));
    DB = DB.concat(genVariants('CONCRETE', COLORS, 'block'));
    DB = DB.concat(genVariants('PLANKS', WOODS, 'block'));
    DB = DB.concat(genVariants('LOG', WOODS, 'block'));
    DB = DB.concat(genVariants('ORE', ORES, 'block'));
    DB = DB.concat(genVariants('INGOT', ['IRON','GOLD','COPPER','NETHERITE'], 'item'));
    DB.push({id:'DIAMOND', name:'diamond', type:'item'});
    DB.push({id:'EMERALD', name:'emerald', type:'item'});

    // --- 3. STATE MANAGEMENT ---
    let state = {
        slots: {},
        selectedSlot: null,
        brush: null, // If null, we are in "Cursor Mode" (Drag to Move)
        size: 54,
        isPainting: false,
        dragSrc: null
    };

    function init() {
        renderPalette();
        renderGrid();
        updateCode();
    }

    function getImageUrl(item) {
        if(item.special) return `${ASSET_BASE}/item/${item.name}.png`; // Handles Chests
        return `${ASSET_BASE}/${item.type}/${item.name}.png`;
    }

    // --- 4. PALETTE LOGIC ---
    function renderPalette() {
        const grid = document.getElementById('palette-grid');
        grid.innerHTML = '';
        const filter = document.getElementById('search-input').value.toLowerCase().replace(/ /g, '_');

        DB.forEach(item => {
            if (!item.id.toLowerCase().includes(filter)) return;
            const div = document.createElement('div');
            div.className = 'palette-item';
            div.onclick = () => setBrush(item);
            
            const img = document.createElement('img');
            img.src = getImageUrl(item);
            img.onerror = () => { img.style.display='none'; }; // Hide broken textures
            
            div.appendChild(img);
            grid.appendChild(div);
        });
    }

    function filterPalette() { renderPalette(); }

    function setBrush(item) {
        state.brush = item;
        const nameDisplay = document.getElementById('brush-name');
        const imgDisplay = document.getElementById('brush-img');
        
        if(item) {
            nameDisplay.innerText = item.id;
            nameDisplay.style.color = 'var(--end-rod)';
            imgDisplay.src = getImageUrl(item);
            imgDisplay.style.display = 'block';
        } else {
            nameDisplay.innerText = "CURSOR (Drag Mode)";
            nameDisplay.style.color = 'var(--amethyst)';
            imgDisplay.style.display = 'none';
        }
    }

    // --- 5. GRID & INTERACTION LOGIC ---
    function setGridSize(s) { state.size = s; renderGrid(); updateCode(); }

    function renderGrid() {
        const grid = document.getElementById('gui-grid');
        grid.innerHTML = '';

        for (let i = 0; i < state.size; i++) {
            const slot = document.createElement('div');
            slot.className = 'gui-slot';
            if (state.selectedSlot === i) slot.classList.add('selected');
            
            // Render content
            if (state.slots[i]) {
                const itemData = DB.find(x => x.id === state.slots[i].id) || {type:'item', name:'barrier'};
                const img = document.createElement('img');
                img.src = getImageUrl(itemData);
                slot.appendChild(img);
            }

            // --- MOUSE EVENTS ---
            
            // 1. Mouse Down (Start Paint or Start Drag)
            slot.onmousedown = (e) => {
                if(e.button === 0) { // Left Click
                    if(state.brush) {
                        // PAINT MODE
                        state.isPainting = true;
                        applyBrush(i);
                    } else {
                        // DRAG MODE
                        // Use standard HTML5 Drag API handling below
                    }
                    selectSlot(i);
                }
            };

            // 2. Mouse Enter (Continue Paint)
            slot.onmouseenter = (e) => {
                if(state.isPainting && state.brush) {
                    applyBrush(i);
                    selectSlot(i);
                }
                showTooltip(e, i);
            };

            // 3. Mouse Up (Stop Paint)
            slot.onmouseup = () => { state.isPainting = false; };
            
            // 4. Mouse Leave (Tooltip)
            slot.onmouseleave = () => {
                document.getElementById('mc-tooltip').style.display = 'none';
            };

            // 5. Right Click (Delete)
            slot.oncontextmenu = (e) => {
                e.preventDefault();
                delete state.slots[i];
                if(state.selectedSlot === i) loadProperties(null);
                renderGrid();
                updateCode();
            };

            // 6. Native Drag API (Only enabled if NO BRUSH)
            if (!state.brush) {
                slot.draggable = true;
                slot.ondragstart = (e) => {
                    if(!state.slots[i]) { e.preventDefault(); return; }
                    state.dragSrc = i;
                    document.getElementById('mc-tooltip').style.display = 'none';
                };
                slot.ondragover = (e) => { e.preventDefault(); }; // Allow drop
                slot.ondrop = (e) => {
                    e.preventDefault();
                    if(state.dragSrc === null) return;
                    // Swap
                    const temp = state.slots[i];
                    state.slots[i] = state.slots[state.dragSrc];
                    if(temp) state.slots[state.dragSrc] = temp;
                    else delete state.slots[state.dragSrc];
                    
                    state.dragSrc = null;
                    renderGrid();
                    updateCode();
                };
            }

            grid.appendChild(slot);
        }
    }

    function endPaint() { state.isPainting = false; }

    function applyBrush(index) {
        if(!state.brush) return;
        state.slots[index] = { id: state.brush.id, name: '', lore: '' };
        renderGrid();
        updateCode();
    }

    function selectSlot(index) {
        state.selectedSlot = index;
        const allSlots = document.querySelectorAll('.gui-slot');
        allSlots.forEach(s => s.classList.remove('selected'));
        if(allSlots[index]) allSlots[index].classList.add('selected');
        loadProperties(index);
    }

    // --- 6. TOOLTIP & COLOR PARSER ---
    const MC_COLORS = {
        '0': '#000000', '1': '#0000AA', '2': '#00AA00', '3': '#00AAAA',
        '4': '#AA0000', '5': '#AA00AA', '6': '#FFAA00', '7': '#AAAAAA',
        '8': '#555555', '9': '#5555FF', 'a': '#55FF55', 'b': '#55FFFF',
        'c': '#FF5555', 'd': '#FF55FF', 'e': '#FFFF55', 'f': '#FFFFFF'
    };

    function parseMcColors(text) {
        if(!text) return '';
        let html = '';
        let parts = text.split(/(&[0-9a-fk-or])/g);
        let currentColor = '#ffffff'; // default white
        let isBold = false;
        let isItalic = false;

        // Basic iteration to handle styles
        parts.forEach(part => {
            if(part.startsWith('&')) {
                const code = part.charAt(1).toLowerCase();
                if(MC_COLORS[code]) {
                    currentColor = MC_COLORS[code];
                    isBold = false; isItalic = false; // Reset formats on color change (MC logic)
                } else if(code === 'l') isBold = true;
                else if(code === 'o') isItalic = true;
                else if(code === 'r') { currentColor = '#ffffff'; isBold = false; isItalic = false; }
            } else if(part.length > 0) {
                html += `<span style="color:${currentColor}; font-weight:${isBold?'bold':'normal'}; font-style:${isItalic?'italic':'normal'}">${part}</span>`;
            }
        });
        return html;
    }

    function showTooltip(e, index) {
        const data = state.slots[index];
        if(!data) return;

        const tt = document.getElementById('mc-tooltip');
        
        // Name
        let nameHtml = data.name ? parseMcColors(data.name) : `<span style="color:#55FFFF">${data.id.replace(/_/g,' ')}</span>`; // Default blueish for items
        
        // Lore
        let loreHtml = '';
        if(data.lore) {
            loreHtml = data.lore.split('\n').map(line => `<div>${parseMcColors(line)}</div>`).join('');
        }

        tt.innerHTML = `<div class="mc-text" style="margin-bottom:4px;">${nameHtml}</div><div class="mc-text" style="color:#aaaaaa">${loreHtml}</div>`;
        
        tt.style.display = 'block';
        tt.style.left = (e.clientX + 15) + 'px';
        tt.style.top = (e.clientY + 15) + 'px';
    }

    // --- 7. PROPERTIES & EXPORT ---
    function loadProperties(index) {
        const data = (index !== null) ? state.slots[index] : null;
        if (!data) {
            document.getElementById('prop-mat').value = "";
            document.getElementById('prop-name').value = "";
            document.getElementById('prop-lore').value = "";
        } else {
            document.getElementById('prop-mat').value = data.id;
            document.getElementById('prop-name').value = data.name;
            document.getElementById('prop-lore').value = data.lore;
        }
    }

    function updateSlotData() {
        if (state.selectedSlot === null || !state.slots[state.selectedSlot]) return;
        state.slots[state.selectedSlot].name = document.getElementById('prop-name').value;
        state.slots[state.selectedSlot].lore = document.getElementById('prop-lore').value;
        // Refresh tooltip if hovering
        updateCode();
    }

    function clearSelectedSlot() {
        if(state.selectedSlot !== null) {
            delete state.slots[state.selectedSlot];
            renderGrid();
            loadProperties(null);
            updateCode();
        }
    }

    function updateCode() {
        const title = document.getElementById('gui-title').value;
        let c = `public void openGui(Player player) {\n`;
        c += `    Inventory inv = Bukkit.createInventory(null, ${state.size}, "${title}");\n\n`;

        Object.keys(state.slots).forEach(key => {
            const s = state.slots[key];
            c += `    // Slot ${key}\n`;
            c += `    ItemStack item${key} = new ItemStack(Material.${s.id});\n`;
            c += `    ItemMeta meta${key} = item${key}.getItemMeta();\n`;
            if (s.name) c += `    meta${key}.setDisplayName("${s.name.replace(/&/g, '§')}");\n`;
            if (s.lore) {
                const lines = s.lore.split('\n').map(l => `"${l.replace(/&/g, '§')}"`).join(', ');
                c += `    meta${key}.setLore(Arrays.asList(${lines}));\n`;
            }
            c += `    item${key}.setItemMeta(meta${key});\n`;
            c += `    inv.setItem(${key}, item${key});\n\n`;
        });

        c += `    player.openInventory(inv);\n}`;
        document.getElementById('code-output').innerText = c;
    }

    function copyCode() {
        navigator.clipboard.writeText(document.getElementById('code-output').innerText);
        alert("Java Code Copied!");
    }

    // Start
    init();

    // Global Mouse Up to stop painting if mouse leaves window
    window.onmouseup = () => { state.isPainting = false; };
</script>
</body>
</html>
