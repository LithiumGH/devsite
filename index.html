<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC DevSuite | Professional Plugin Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Color Palette - Dark Slate & Electric Blue */
            --bg-deep: #0f172a;
            --bg-panel: #1e293b;
            --bg-hover: #334155;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --text-dim: #94a3b8;
            --text-bright: #f8fafc;
            --border: #334155;
            --code-bg: #020617;
            
            /* Minecraft Specifics */
            --mc-slot: #374151;
            --mc-border: #1e293b;
        }

        * { box-sizing: border-box; outline: none; }
        body {
            margin: 0;
            background-color: var(--bg-deep);
            color: var(--text-bright);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- SIDE NAVIGATION --- */
        nav {
            width: 70px;
            background: var(--bg-deep);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 20px;
        }
        .nav-item {
            width: 45px; height: 45px;
            background: var(--bg-panel);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--border);
        }
        .nav-item:hover { border-color: var(--accent); color: var(--accent); }
        .nav-item.active { background: var(--accent); color: white; border: none; box-shadow: 0 0 15px var(--accent-glow); }

        /* --- MAIN LAYOUT --- */
        main { flex: 1; display: flex; flex-direction: column; }
        
        header {
            height: 60px;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
        }
        .brand { font-weight: 600; letter-spacing: 1px; font-size: 18px; }
        .brand span { color: var(--accent); }

        .content-area { display: flex; flex: 1; overflow: hidden; }
        .tab-content { display: none; width: 100%; height: 100%; }
        .tab-content.active { display: flex; }

        /* --- GUI EDITOR SPECIFICS --- */
        .sidebar {
            width: 300px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .scroll-box { flex: 1; overflow-y: auto; padding: 15px; }
        
        .canvas {
            flex: 1;
            background: var(--bg-deep);
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        /* Inventory Grid Style */
        .inventory-card {
            background: #c6c6c6;
            padding: 12px;
            border-radius: 4px;
            border: 3px solid #555;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .inv-grid {
            display: grid;
            grid-template-columns: repeat(9, 40px);
            gap: 2px;
        }
        .slot {
            width: 40px; height: 40px;
            background: #8b8b8b;
            border: 2px solid;
            border-color: #373737 #ffffff #ffffff #373737;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .slot:hover { background: #bebebe; }
        .slot img { width: 32px; height: 32px; image-rendering: pixelated; }

        /* --- UI COMPONENTS --- */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; }
        input, textarea, select {
            width: 100%;
            background: var(--bg-deep);
            border: 1px solid var(--border);
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-family: 'Inter';
        }
        .code-output {
            background: var(--code-bg);
            padding: 15px;
            border-radius: 8px;
            font-family: 'JetBrains Mono';
            font-size: 12px;
            color: #7dd3fc;
            overflow: auto;
            max-height: 300px;
            white-space: pre;
            border: 1px solid var(--border);
        }
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }

        /* Library Grid */
        .item-library {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 5px;
        }
        .lib-icon {
            width: 40px; height: 40px;
            background: var(--bg-deep);
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px; cursor: pointer;
        }
        .lib-icon:hover { border-color: var(--accent); }
        .lib-icon.active { border-color: var(--accent); background: rgba(59, 130, 246, 0.1); }
    </style>
</head>
<body>

<nav>
    <div class="nav-item active" onclick="switchTab('gui')" title="GUI Maker">🔲</div>
    <div class="nav-item" onclick="switchTab('cmd')" title="Command Generator">⚡</div>
    <div class="nav-item" onclick="switchTab('recipe')" title="Recipe Creator">🛠️</div>
</nav>

<main>
    <header>
        <div class="brand">MC<span>DEVSUITE</span></div>
        <div id="status-msg" style="color: var(--text-dim); font-size: 13px;">Editing: New Inventory</div>
    </header>

    <div class="content-area">
        <div id="tab-gui" class="tab-content active">
            <div class="sidebar">
                <div class="scroll-box">
                    <div class="input-group">
                        <label>Search Items</label>
                        <input type="text" id="search" placeholder="Diamond..." oninput="renderLibrary()">
                    </div>
                    <div class="item-library" id="library"></div>
                </div>
                <div style="padding: 15px; border-top: 1px solid var(--border)">
                    <div class="input-group">
                        <label>Item Name</label>
                        <input type="text" id="item-name" placeholder="&bMagic Sword" oninput="updateItemData()">
                    </div>
                    <button class="btn" style="width:100%" onclick="copyCode('gui-code')">Copy Java Code</button>
                </div>
            </div>
            
            <div class="canvas">
                <input type="text" id="gui-title" value="My Custom Menu" style="background:transparent; border:none; text-align:center; font-size:24px; font-weight:bold; margin-bottom:20px;">
                <div class="inventory-card">
                    <div class="inv-grid" id="grid"></div>
                </div>
                <div style="margin-top:20px;">
                    <button class="btn" onclick="resizeGrid(27)">3 Rows</button>
                    <button class="btn" onclick="resizeGrid(54)">6 Rows</button>
                </div>
                <div style="width: 80%; margin-top: 30px;">
                    <div class="code-output" id="gui-code"></div>
                </div>
            </div>
        </div>

        <div id="tab-cmd" class="tab-content" style="padding: 40px; flex-direction: column; overflow-y: auto;">
            <h2>Command Generator</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
                <div>
                    <div class="input-group">
                        <label>Command Name</label>
                        <input type="text" id="cmd-name" placeholder="heal" oninput="genCommand()">
                    </div>
                    <div class="input-group">
                        <label>Permission</label>
                        <input type="text" id="cmd-perm" placeholder="myplugin.heal" oninput="genCommand()">
                    </div>
                    <div class="input-group">
                        <label>Description</label>
                        <input type="text" id="cmd-desc" placeholder="Heals the player" oninput="genCommand()">
                    </div>
                </div>
                <div class="code-output" id="cmd-code" style="height: 400px;"></div>
            </div>
        </div>
    </div>
</main>

<script>
    // --- STATE MANAGEMENT ---
    let state = {
        currentTab: 'gui',
        brush: 'diamond_sword',
        gridSize: 27,
        inventory: {}, // slot index: {id, name, lore}
        selectedSlot: null
    };

    const ASSET_URL = "https://assets.mcasset.cloud/1.21/assets/minecraft/textures/item/";

    // --- CORE LOGIC ---
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        
        document.getElementById('tab-' + tabId).classList.add('active');
        event.currentTarget.classList.add('active');
        state.currentTab = tabId;
    }

    // --- GUI MAKER LOGIC ---
    function renderLibrary() {
        const lib = document.getElementById('library');
        const filter = document.getElementById('search').value.toLowerCase();
        const items = ['diamond_sword', 'gold_ingot', 'apple', 'chest', 'cobblestone', 'emerald', 'iron_axe', 'barrier', 'paper', 'book'];
        
        lib.innerHTML = '';
        items.filter(i => i.includes(filter)).forEach(item => {
            const div = document.createElement('div');
            div.className = `lib-icon ${state.brush === item ? 'active' : ''}`;
            div.innerHTML = `<img src="${ASSET_URL}${item}.png" width="24">`;
            div.onclick = () => { state.brush = item; renderLibrary(); };
            lib.appendChild(div);
        });
    }

    function resizeGrid(size) {
        state.gridSize = size;
        renderGrid();
    }

    function renderGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        for(let i=0; i<state.gridSize; i++) {
            const slot = document.createElement('div');
            slot.className = 'slot';
            if(state.inventory[i]) {
                slot.innerHTML = `<img src="${ASSET_URL}${state.inventory[i].id}.png">`;
            }
            slot.onclick = () => {
                state.inventory[i] = { id: state.brush, name: '', lore: '' };
                state.selectedSlot = i;
                renderGrid();
                updateGuiCode();
            };
            grid.appendChild(slot);
        }
        updateGuiCode();
    }

    function updateGuiCode() {
        const title = document.getElementById('gui-title').value;
        let code = `// Generated by MC DevSuite\n`;
        code += `Inventory inv = Bukkit.createInventory(null, ${state.gridSize}, "${title}");\n\n`;
        
        Object.keys(state.inventory).forEach(idx => {
            const item = state.inventory[idx];
            code += `ItemStack item${idx} = new ItemStack(Material.${item.id.toUpperCase()});\n`;
            code += `inv.setItem(${idx}, item${idx});\n`;
        });
        
        document.getElementById('gui-code').innerText = code;
    }

    // --- COMMAND GENERATOR LOGIC ---
    function genCommand() {
        const name = document.getElementById('cmd-name').value || 'example';
        const perm = document.getElementById('cmd-perm').value || 'plugin.use';
        const desc = document.getElementById('cmd-desc').value || 'Description here';

        const code = `
@Override
public boolean onCommand(CommandSender sender, Command cmd, String label, String[] args) {
    if (!sender.hasPermission("${perm}")) {
        sender.sendMessage("§cNo permission!");
        return true;
    }
    
    if (!(sender instanceof Player)) {
        sender.sendMessage("Only players can use /${name}");
        return true;
    }

    Player player = (Player) sender;
    player.sendMessage("§aYou executed /${name}!");
    
    return true;
}`;
        document.getElementById('cmd-code').innerText = code.trim();
    }

    function copyCode(id) {
        const text = document.getElementById(id).innerText;
        navigator.clipboard.writeText(text);
        alert("Code copied to clipboard!");
    }

    // Initialize
    renderLibrary();
    renderGrid();
    genCommand();

</script>
</body>
</html>
