<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>End-Tier GUI Architect v3</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian: #0d0714;
            --amethyst: #9966cc;
            --void-purp: #2d1b4d;
            --end-rod: #e0d0f0;
            --mc-gui: #c6c6c6;
            --mc-border-dark: #373737;
            --mc-border-light: #ffffff;
            --tooltip-bg: rgba(16, 0, 16, 0.95);
        }

        * { box-sizing: border-box; }

        body {
            background: radial-gradient(circle at center, #1a0f2e 0%, var(--obsidian) 100%);
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            padding: 20px;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            user-select: none; /* Important for dragging */
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            color: var(--amethyst);
            text-align: center;
            font-size: 18px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 0px #000;
        }

        /* LAYOUT */
        .editor-container {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 20px;
            height: calc(100vh - 70px);
            max-width: 1600px;
            margin: 0 auto;
        }

        .panel {
            background: rgba(45, 27, 77, 0.9);
            border: 2px solid var(--amethyst);
            display: flex;
            flex-direction: column;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .panel-header {
            background: var(--amethyst);
            color: #000;
            padding: 10px;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            text-align: center;
            font-weight: bold;
        }

        .panel-content {
            padding: 15px;
            overflow-y: auto;
            flex: 1;
        }

        /* PALETTE */
        .search-bar {
            width: 100%;
            background: #000;
            border: 1px solid var(--amethyst);
            color: #fff;
            padding: 8px;
            margin-bottom: 10px;
            font-family: inherit;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 4px;
        }

        .palette-item {
            width: 100%;
            aspect-ratio: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .palette-item:hover { border-color: var(--end-rod); background: rgba(255,255,255,0.1); }
        .palette-item img { width: 32px; height: 32px; image-rendering: pixelated; }

        /* CANVAS AREA */
        .canvas-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
            position: relative; /* Context for tooltip */
        }

        .gui-frame {
            background: var(--mc-gui);
            padding: 10px;
            border: 4px solid var(--mc-border-dark);
            border-radius: 2px;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.6);
            position: relative;
        }

        #gui-grid {
            display: grid;
            grid-template-columns: repeat(9, 50px);
            gap: 4px;
        }

        .gui-slot {
            width: 50px;
            height: 50px;
            background: #8b8b8b;
            border: 2px solid;
            border-color: #373737 #fff #fff #373737;
            position: relative;
            cursor: pointer;
        }

        .gui-slot:hover { background: #a0a0a0; }
        .gui-slot.selected { outline: 3px solid var(--amethyst); z-index: 10; }
        
        /* Dragging Visuals */
        .gui-slot.drag-over { background: #bdbdbd; border-color: var(--amethyst); }

        .gui-slot img {
            width: 40px;
            height: 40px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            image-rendering: pixelated;
            pointer-events: none; /* Allows clicks to pass to div */
        }

        /* TOOLTIP */
        #mc-tooltip {
            position: fixed;
            background: var(--tooltip-bg);
            border: 2px solid #2a004e;
            padding: 8px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 9999;
            display: none;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            min-width: 150px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            line-height: 1.4;
        }
        
        #tooltip-title { color: #a020f0; font-weight: bold; margin-bottom: 4px; display: block; text-shadow: 1px 1px 0 #000; }
        #tooltip-lore { color: #b0b0b0; font-size: 11px; }

        /* PROPERTIES */
        label { display: block; margin: 10px 0 5px; font-size: 12px; color: var(--end-rod); }
        
        input, textarea {
            width: 100%;
            background: #111;
            border: 1px solid #555;
            color: #fff;
            padding: 8px;
            font-family: 'JetBrains Mono', monospace;
        }
        
        input:focus, textarea:focus { border-color: var(--amethyst); outline: none; }

        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button {
            background: var(--amethyst);
            border: none;
            color: white;
            padding: 10px;
            flex: 1;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
        }
        button:hover { filter: brightness(1.2); }
        button.danger { background: #cc4444; }

        .code-preview {
            margin-top: 20px;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 4px;
            font-size: 11px;
            height: 200px;
            overflow: auto;
            white-space: pre;
            color: #d4d4d4;
            border: 1px solid #333;
        }
        
        .keyword { color: #c586c0; }
        .string { color: #ce9178; }
        .comment { color: #6a9955; }
    </style>
</head>
<body>

<div id="mc-tooltip">
    <span id="tooltip-title"></span>
    <div id="tooltip-lore"></div>
</div>

<h1>GUI Architect v3.0 <span style="font-size:10px; color:#888;">(Drag & Drop Enabled)</span></h1>

<div class="editor-container">
    
    <div class="panel">
        <div class="panel-header">Items</div>
        <div class="panel-content">
            <input type="text" class="search-bar" placeholder="Search..." id="search-input" onkeyup="filterPalette()">
            <div class="palette-grid" id="palette-grid"></div>
        </div>
    </div>

    <div class="canvas-area">
        <input type="text" id="gui-title" value="Menu Title" style="text-align: center; font-size: 16px; width: 300px; background: transparent; border: none; border-bottom: 2px solid var(--amethyst); margin-bottom: 15px;">
        
        <div class="gui-frame">
            <div id="gui-grid"></div>
        </div>

        <div class="btn-group" style="width: 300px;">
            <button onclick="setGridSize(27)">3 Rows</button>
            <button onclick="setGridSize(54)">6 Rows</button>
        </div>
        <p style="margin-top:10px; font-size: 12px; color: #888;">Active Brush: <strong id="active-brush" style="color:var(--amethyst)">None</strong></p>
    </div>

    <div class="panel">
        <div class="panel-header">Meta Data</div>
        <div class="panel-content">
            <label>Item ID</label>
            <input type="text" id="prop-mat" readonly style="color: #666;">

            <label>Name (& codes)</label>
            <input type="text" id="prop-name" placeholder="&dCool Sword" oninput="updateSlotData()">

            <label>Lore</label>
            <textarea id="prop-lore" rows="5" placeholder="&7Line 1&#10;&7Line 2" oninput="updateSlotData()"></textarea>

            <div class="btn-group">
                <button class="danger" onclick="clearSelectedSlot()">Clear</button>
            </div>

            <label style="margin-top: 20px;">Code Output</label>
            <div class="code-preview" id="code-output"></div>
            <button onclick="copyCode()" style="margin-top: 10px;">Copy Java</button>
        </div>
    </div>
</div>

<script>
    const ASSET_BASE = "https://assets.mcasset.cloud/1.20.1/assets/minecraft/textures";
    
    // EXTENDED DATABASE
    const DB = [
        { id: 'DIAMOND_SWORD', type: 'item', name: 'diamond_sword' },
        { id: 'NETHERITE_AXE', type: 'item', name: 'netherite_axe' },
        { id: 'BOW', type: 'item', name: 'bow' },
        { id: 'ARROW', type: 'item', name: 'arrow' },
        { id: 'GOLDEN_APPLE', type: 'item', name: 'golden_apple' },
        { id: 'ENCHANTED_GOLDEN_APPLE', type: 'item', name: 'enchanted_golden_apple' },
        { id: 'ENDER_PEARL', type: 'item', name: 'ender_pearl' },
        { id: 'FIREWORK_ROCKET', type: 'item', name: 'firework_rocket' },
        { id: 'EXPERIENCE_BOTTLE', type: 'item', name: 'experience_bottle' },
        { id: 'TOTEM_OF_UNDYING', type: 'item', name: 'totem_of_undying' },
        { id: 'NETHER_STAR', type: 'item', name: 'nether_star' },
        { id: 'BEACON', type: 'block', name: 'beacon' },
        { id: 'TNT', type: 'block', name: 'tnt_side' },
        { id: 'CHEST', type: 'block', name: 'chest_inventory', special: true },
        { id: 'ENDER_CHEST', type: 'block', name: 'ender_chest_inventory', special: true },
        { id: 'GRASS_BLOCK', type: 'block', name: 'grass_block_side' },
        { id: 'DIAMOND_ORE', type: 'block', name: 'diamond_ore' },
        { id: 'AMETHYST_SHARD', type: 'item', name: 'amethyst_shard' },
        { id: 'BOOK', type: 'item', name: 'book' },
        { id: 'PAPER', type: 'item', name: 'paper' },
        { id: 'BARRIER', type: 'item', name: 'barrier' }
    ];

    let state = {
        slots: {}, // { index: { id, name, lore } }
        selectedSlot: null,
        brush: null,
        size: 54,
        dragSrc: null
    };

    function init() {
        renderPalette();
        renderGrid();
        updateCode();
    }

    // --- IMAGES ---
    function getImageUrl(item) {
        if(item.special) return `${ASSET_BASE}/item/${item.name}.png`;
        return `${ASSET_BASE}/${item.type}/${item.name}.png`;
    }

    // --- PALETTE ---
    function renderPalette() {
        const grid = document.getElementById('palette-grid');
        grid.innerHTML = '';
        const filter = document.getElementById('search-input').value.toLowerCase();

        DB.forEach(item => {
            if (!item.id.toLowerCase().includes(filter)) return;
            const div = document.createElement('div');
            div.className = 'palette-item';
            div.onclick = () => {
                state.brush = item;
                document.getElementById('active-brush').innerText = item.id;
            };
            const img = document.createElement('img');
            img.src = getImageUrl(item);
            div.appendChild(img);
            grid.appendChild(div);
        });
    }
    
    function filterPalette() { renderPalette(); }

    // --- GRID RENDERING ---
    function setGridSize(s) { state.size = s; renderGrid(); updateCode(); }

    function renderGrid() {
        const grid = document.getElementById('gui-grid');
        grid.innerHTML = '';

        for (let i = 0; i < state.size; i++) {
            const slot = document.createElement('div');
            slot.className = 'gui-slot';
            slot.dataset.index = i; // For drag events
            
            // Selection Style
            if (state.selectedSlot === i) slot.classList.add('selected');

            // Render Item
            if (state.slots[i]) {
                const itemData = DB.find(x => x.id === state.slots[i].id);
                if (itemData) {
                    const img = document.createElement('img');
                    img.src = getImageUrl(itemData);
                    slot.appendChild(img);
                }
            }

            // --- EVENTS ---
            
            // 1. Click / Paint
            slot.onclick = () => {
                if(state.brush) {
                    state.slots[i] = { id: state.brush.id, name: '', lore: '' };
                    state.brush = null; // Consume brush
                    document.getElementById('active-brush').innerText = "None";
                    renderGrid();
                }
                state.selectedSlot = i;
                renderGrid();
                loadProperties(i);
            };

            // 2. Right Click (Delete)
            slot.oncontextmenu = (e) => {
                e.preventDefault();
                delete state.slots[i];
                if(state.selectedSlot === i) loadProperties(null); // Clear form if selected
                renderGrid();
                updateCode();
            };

            // 3. Hover (Tooltip)
            slot.onmousemove = (e) => showTooltip(e, i);
            slot.onmouseleave = hideTooltip;

            // 4. Drag & Drop
            slot.draggable = true;
            slot.ondragstart = (e) => handleDragStart(e, i);
            slot.ondragover = (e) => handleDragOver(e, slot);
            slot.ondrop = (e) => handleDrop(e, i);
            slot.ondragleave = (e) => slot.classList.remove('drag-over');

            grid.appendChild(slot);
        }
    }

    // --- INTERACTION LOGIC ---

    // Drag & Drop
    function handleDragStart(e, index) {
        if (!state.slots[index]) {
            e.preventDefault(); // Cannot drag empty
            return;
        }
        state.dragSrc = index;
        e.dataTransfer.effectAllowed = "move";
        // Hide tooltip while dragging
        hideTooltip();
    }

    function handleDragOver(e, slotDiv) {
        e.preventDefault(); // Necessary to allow dropping
        e.dataTransfer.dropEffect = "move";
        slotDiv.classList.add('drag-over');
    }

    function handleDrop(e, targetIndex) {
        e.preventDefault();
        document.querySelectorAll('.gui-slot').forEach(s => s.classList.remove('drag-over'));

        if (state.dragSrc === null || state.dragSrc === targetIndex) return;

        // Swap Logic
        const srcData = state.slots[state.dragSrc];
        const targetData = state.slots[targetIndex];

        state.slots[targetIndex] = srcData;
        if (targetData) {
            state.slots[state.dragSrc] = targetData;
        } else {
            delete state.slots[state.dragSrc];
        }

        // Reset Selection to follow the moved item (optional UX choice)
        if(state.selectedSlot === state.dragSrc) state.selectedSlot = targetIndex;
        
        state.dragSrc = null;
        renderGrid();
        updateCode();
    }


    // Tooltip Logic
    const tooltip = document.getElementById('mc-tooltip');
    const ttTitle = document.getElementById('tooltip-title');
    const ttLore = document.getElementById('tooltip-lore');

    function showTooltip(e, index) {
        const data = state.slots[index];
        if (!data) {
            tooltip.style.display = 'none';
            return;
        }

        // Format Title
        const rawName = data.name || data.id;
        ttTitle.innerHTML = rawName.replace(/&([0-9a-f])/g, '<span style="color:var(--amethyst)">$1</span>') // Simplistic color parse
                                   .replace(/&/g, '§'); // Fallback visual

        // Format Lore
        if (data.lore) {
            ttLore.innerHTML = data.lore.replace(/\n/g, '<br>').replace(/&/g, '§');
            ttLore.style.display = 'block';
        } else {
            ttLore.style.display = 'none';
        }

        tooltip.style.display = 'block';
        tooltip.style.left = (e.clientX + 15) + 'px';
        tooltip.style.top = (e.clientY + 15) + 'px';
    }

    function hideTooltip() {
        tooltip.style.display = 'none';
    }

    // --- PROPERTIES ---
    function loadProperties(index) {
        const data = (index !== null) ? state.slots[index] : null;
        
        if (!data) {
            document.getElementById('prop-mat').value = "";
            document.getElementById('prop-name').value = "";
            document.getElementById('prop-lore').value = "";
        } else {
            document.getElementById('prop-mat').value = data.id;
            document.getElementById('prop-name').value = data.name;
            document.getElementById('prop-lore').value = data.lore;
        }
    }

    function updateSlotData() {
        if (state.selectedSlot === null || !state.slots[state.selectedSlot]) return;
        state.slots[state.selectedSlot].name = document.getElementById('prop-name').value;
        state.slots[state.selectedSlot].lore = document.getElementById('prop-lore').value;
        updateCode();
    }

    function clearSelectedSlot() {
        if (state.selectedSlot === null) return;
        delete state.slots[state.selectedSlot];
        renderGrid();
        loadProperties(null);
        updateCode();
    }

    // --- EXPORT ---
    function updateCode() {
        const title = document.getElementById('gui-title').value;
        let c = `<span class="keyword">public void</span> openGui(Player player) {\n`;
        c += `    Inventory inv = Bukkit.createInventory(<span class="keyword">null</span>, ${state.size}, <span class="string">"${title}"</span>);\n\n`;

        for (let i = 0; i < state.size; i++) {
            if (state.slots[i]) {
                const s = state.slots[i];
                c += `    <span class="comment">// Slot ${i}</span>\n`;
                c += `    ItemStack item${i} = <span class="keyword">new</span> ItemStack(Material.${s.id});\n`;
                c += `    ItemMeta meta${i} = item${i}.getItemMeta();\n`;
                if (s.name) c += `    meta${i}.setDisplayName(<span class="string">"${s.name.replace(/&/g, '§')}"</span>);\n`;
                if (s.lore) {
                    const lines = s.lore.split('\n').map(l => `"<span class="string">${l.replace(/&/g, '§')}</span>"`).join(', ');
                    c += `    meta${i}.setLore(Arrays.asList(${lines}));\n`;
                }
                c += `    item${i}.setItemMeta(meta${i});\n`;
                c += `    inv.setItem(${i}, item${i});\n\n`;
            }
        }
        c += `    player.openInventory(inv);\n}`;
        document.getElementById('code-output').innerHTML = c;
    }

    function copyCode() {
        const text = document.getElementById('code-output').innerText;
        navigator.clipboard.writeText(text);
        alert("Java Code Copied!");
    }

    init();
</script>
</body>
</html>
