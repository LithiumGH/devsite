<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUI Architect v5 (Optimized)</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian: #120b1a;
            --amethyst: #9966cc;
            --dark-purp: #251a33;
            --end-rod: #e0d0f0;
            --mc-gui: #c6c6c6;
            --mc-border-dark: #373737;
            --mc-border-light: #ffffff;
            --tooltip-bg: rgba(16, 0, 16, 0.98);
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            background: radial-gradient(circle at center, #1d112b 0%, var(--obsidian) 100%);
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            padding: 20px;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* LAYOUT */
        .editor-container {
            display: grid;
            grid-template-columns: 350px 1fr 320px;
            gap: 20px;
            height: calc(100vh - 70px);
            max-width: 1900px;
            margin: 0 auto;
        }

        .panel {
            background: rgba(37, 26, 51, 0.95);
            border: 2px solid var(--amethyst);
            display: flex;
            flex-direction: column;
            border-radius: 6px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .panel-header {
            background: var(--amethyst);
            color: #000;
            padding: 12px;
            font-family: 'Press Start 2P', cursive;
            font-size: 11px;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
        }

        .panel-content { padding: 0; overflow-y: hidden; display: flex; flex-direction: column; flex: 1; }

        /* PALETTE OPTIMIZATIONS */
        .search-container { padding: 10px; background: #000; border-bottom: 1px solid #333; }
        .search-bar {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #555;
            color: #fff;
            padding: 10px;
            font-family: inherit;
            border-radius: 4px;
        }
        .search-bar:focus { border-color: var(--amethyst); outline: none; }

        .palette-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
            gap: 6px;
        }

        .palette-item {
            width: 100%;
            aspect-ratio: 1;
            background: rgba(0,0,0,0.4);
            border: 1px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.1s;
        }

        .palette-item:hover { border-color: var(--end-rod); background: rgba(255,255,255,0.1); }
        .palette-item.active-brush { border-color: #55ff55; background: rgba(0,255,0,0.15); box-shadow: 0 0 10px #55ff55; }
        
        .palette-item img { 
            width: 32px; height: 32px; 
            image-rendering: pixelated; 
            pointer-events: none; 
            object-fit: contain;
        }

        /* CANVAS */
        .canvas-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            position: relative;
        }

        .gui-frame {
            background: var(--mc-gui);
            padding: 10px;
            border: 4px solid var(--mc-border-dark);
            border-radius: 2px;
            box-shadow: 20px 20px 0px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        #gui-grid {
            display: grid;
            grid-template-columns: repeat(9, 54px);
            gap: 4px;
        }

        .gui-slot {
            width: 54px;
            height: 54px;
            background: #8b8b8b;
            border: 2px solid;
            border-color: #373737 #fff #fff #373737;
            position: relative;
            cursor: pointer;
        }

        .gui-slot:hover { background: #a8a8a8; }
        .gui-slot.selected { outline: 3px solid var(--amethyst); z-index: 10; }
        .gui-slot img {
            width: 44px; height: 44px;
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            image-rendering: pixelated; pointer-events: none;
        }

        /* TOOLTIP */
        #mc-tooltip {
            position: fixed;
            background: var(--tooltip-bg);
            border: 2px solid #2a004e;
            padding: 12px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 9999;
            display: none;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.5);
            min-width: 180px;
            max-width: 300px;
        }
        
        /* PROPERTIES PANEL */
        .props-inner { padding: 15px; overflow-y: auto; height: 100%; }
        
        label { display: block; margin: 15px 0 5px; font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        input, textarea {
            width: 100%; background: #111; border: 1px solid #444;
            color: #fff; padding: 10px; font-family: 'JetBrains Mono', monospace;
            border-radius: 4px; user-select: text;
        }
        input:focus, textarea:focus { border-color: var(--amethyst); outline: none; background: #1a1a1a; }

        button {
            background: var(--amethyst); border: none; color: white;
            padding: 12px; width: 100%; cursor: pointer;
            font-family: 'Press Start 2P', cursive; font-size: 10px; 
            margin-top: 5px; border-radius: 4px;
            box-shadow: 0 4px 0 #6a329f;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        button:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
        button.secondary { background: #555; box-shadow: 0 4px 0 #333; }
        button.danger { background: #aa3333; box-shadow: 0 4px 0 #771111; }

        .code-preview {
            background: #151515; padding: 15px;
            border-radius: 4px; font-size: 11px; height: 200px;
            overflow: auto; white-space: pre; color: #d4d4d4;
            border: 1px solid #333; user-select: text; margin-top: 5px;
        }

        h1 { margin: 0 0 20px; font-size: 18px; color: var(--amethyst); text-shadow: 3px 3px 0 #000; text-align: center; }

        /* BRUSH BAR */
        .brush-bar {
            display: flex; align-items: center; gap: 10px; 
            background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 50px;
            border: 1px solid var(--amethyst);
        }
    </style>
</head>
<body>

<h1>GUI Architect v5 <span style="font-size:10px; color:#888;">// Optimized</span></h1>

<div class="editor-container">
    
    <div class="panel">
        <div class="panel-header">Item Database</div>
        <div class="panel-content">
            <div class="search-container">
                <input type="text" class="search-bar" placeholder="Search 1000+ items..." id="search-input">
            </div>
            <div class="palette-scroll-area">
                <div class="palette-grid" id="palette-grid">
                    </div>
                <div id="loading-msg" style="text-align: center; color: #666; padding: 20px; font-size: 10px;">End of List</div>
            </div>
        </div>
    </div>

    <div class="canvas-area">
        <input type="text" id="gui-title" value="Menu Title" style="text-align: center; font-size: 24px; width: 400px; background: transparent; border: none; border-bottom: 2px solid var(--amethyst); margin-bottom: 30px; font-family: 'Press Start 2P'; color: #fff;">
        
        <div class="gui-frame">
            <div id="gui-grid" onmouseleave="endPaint()"></div>
        </div>

        <div class="brush-bar">
            <div style="font-size: 10px; color: #aaa;">CURRENT TOOL:</div>
            <div id="brush-display" style="display: flex; align-items: center; gap: 10px;">
                <span style="color: var(--amethyst); font-weight: bold;">CURSOR</span> (Drag Mode)
            </div>
            <button onclick="setBrush(null)" style="width: auto; padding: 5px 10px; font-size: 8px; margin: 0; margin-left: 20px;" class="secondary">RESET</button>
        </div>

        <div style="display: flex; gap: 10px; width: 300px; margin-top: 20px;">
            <button class="secondary" onclick="setGridSize(27)">3 Rows</button>
            <button class="secondary" onclick="setGridSize(54)">6 Rows</button>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">Properties</div>
        <div class="panel-content props-inner">
            <label>Selected ID</label>
            <input type="text" id="prop-mat" readonly style="color: #666; cursor: not-allowed; border-color: #333;">

            <label>Display Name</label>
            <input type="text" id="prop-name" placeholder="&6Legendary Item" oninput="updateSlotData()">

            <label>Lore (Legacy Colors)</label>
            <textarea id="prop-lore" rows="6" placeholder="&7Line 1&#10;&7Line 2" oninput="updateSlotData()"></textarea>

            <button class="danger" onclick="deleteSlot()">Remove Item</button>

            <label>Java Code</label>
            <div class="code-preview" id="code-output"></div>
            <button onclick="copyCode()">Copy to Clipboard</button>
        </div>
    </div>

</div>

<div id="mc-tooltip"></div>

<script>
    // --- 1. CONFIG & HUGE DB GENERATION ---
    const ASSET_BASE = "https://assets.mcasset.cloud/1.20.1/assets/minecraft/textures";
    
    // We generate standard items procedurally to save file size but cover "All" items.
    const MATERIALS = [
        "IRON","GOLD","DIAMOND","NETHERITE","STONE","WOODEN","LEATHER","CHAINMAIL"
    ];
    const TOOLS = ["SWORD","PICKAXE","AXE","SHOVEL","HOE","HELMET","CHESTPLATE","LEGGINGS","BOOTS"];
    const WOOD_TYPES = ["OAK","SPRUCE","BIRCH","JUNGLE","ACACIA","DARK_OAK","MANGROVE","CHERRY","BAMBOO","CRIMSON","WARPED"];
    const COLORS = ["WHITE","ORANGE","MAGENTA","LIGHT_BLUE","YELLOW","LIME","PINK","GRAY","LIGHT_GRAY","CYAN","PURPLE","BLUE","BROWN","GREEN","RED","BLACK"];
    const ORES = ["COAL","IRON","COPPER","GOLD","REDSTONE","EMERALD","LAPIS","DIAMOND","NETHER_QUARTZ"];
    
    let ITEM_DB = [];

    // Helper to add items
    function add(id) { ITEM_DB.push({ id: id, name: id.toLowerCase() }); }
    
    // 1. Core Tools & Armor
    MATERIALS.forEach(mat => {
        TOOLS.forEach(tool => {
            if(mat === "WOODEN" && (tool.includes("HELMET") || tool.includes("CHEST") || tool.includes("LEG") || tool.includes("BOOT"))) return;
            if((mat === "LEATHER" || mat === "CHAINMAIL") && !tool.includes("HELMET") && !tool.includes("CHEST") && !tool.includes("LEG") && !tool.includes("BOOT")) return;
            add(`${mat}_${tool}`);
        });
    });

    // 2. Colored Blocks (Wool, Glass, Concrete, Beds, Shulkers)
    COLORS.forEach(c => {
        add(`${c}_WOOL`);
        add(`${c}_STAINED_GLASS`);
        add(`${c}_STAINED_GLASS_PANE`);
        add(`${c}_CONCRETE`);
        add(`${c}_CONCRETE_POWDER`);
        add(`${c}_BED`);
        add(`${c}_SHULKER_BOX`);
        add(`${c}_BANNER`);
    });

    // 3. Wood Variants
    WOOD_TYPES.forEach(w => {
        add(`${w}_LOG`);
        add(`${w}_PLANKS`);
        add(`${w}_STAIRS`);
        add(`${w}_SLAB`);
        add(`${w}_FENCE`);
        add(`${w}_DOOR`);
        add(`${w}_SIGN`);
        add(`${w}_BOAT`);
    });

    // 4. Ores & Raw
    ORES.forEach(o => {
        add(`${o}_ORE`);
        add(`DEEPSLATE_${o}_ORE`);
        if(o !== "REDSTONE" && o !== "EMERALD" && o !== "LAPIS" && o !== "DIAMOND" && o !== "COAL" && o !== "NETHER_QUARTZ") add(`RAW_${o}`);
    });

    // 5. Ingot/Gem/Dust
    ["IRON_INGOT","GOLD_INGOT","COPPER_INGOT","NETHERITE_INGOT","DIAMOND","EMERALD","LAPIS_LAZULI","REDSTONE","COAL","CHARCOAL","QUARTZ","AMETHYST_SHARD","ECHO_SHARD"].forEach(i => add(i));

    // 6. Food
    ["APPLE","GOLDEN_APPLE","ENCHANTED_GOLDEN_APPLE","MELON_SLICE","SWEET_BERRIES","GLOW_BERRIES","CHORUS_FRUIT","CARROT","POTATO","BAKED_POTATO","BREAD","COOKED_BEEF","COOKED_PORKCHOP","COOKED_CHICKEN","COOKED_MUTTON","COOKED_COD","COOKED_SALMON","COOKIE","CAKE","PUMPKIN_PIE"].forEach(f => add(f));

    // 7. Utility & Redstone
    ["ARROW","BOW","CROSSBOW","SHIELD","TOTEM_OF_UNDYING","ELYTRA","FIREWORK_ROCKET","TNT","FLINT_AND_STEEL","SHEARS","BUCKET","WATER_BUCKET","LAVA_BUCKET","MILK_BUCKET","ENDER_PEARL","EYE_OF_ENDER","FIRE_CHARGE","MAP","PAPER","BOOK","WRITABLE_BOOK","ENCHANTED_BOOK","COMPASS","RECOVERY_COMPASS","CLOCK","SPYGLASS","NAME_TAG","LEAD","SADDLE"].forEach(u => add(u));
    ["REDSTONE_TORCH","REPEATER","COMPARATOR","LEVER","PISTON","STICKY_PISTON","OBSERVER","DISPENSER","DROPPER","HOPPER","LIGHTNING_ROD","DAYLIGHT_DETECTOR","SCULK_SENSOR"].forEach(r => add(r));

    // 8. Special Blocks
    ["BEACON","CONDUIT","ENDER_CHEST","CHEST","BARREL","FURNACE","BLAST_FURNACE","SMOKER","ANVIL","ENCHANTING_TABLE","CRAFTING_TABLE","LOOM","CARTOGRAPHY_TABLE","FLETCHING_TABLE","SMITHING_TABLE","GRINDSTONE","STONECUTTER","JUKEBOX","NOTE_BLOCK"].forEach(b => add(b));
    ["COBBLESTONE","MOSSY_COBBLESTONE","STONE","SMOOTH_STONE","GRANITE","DIORITE","ANDESITE","DEEPSLATE","COBBLED_DEEPSLATE","TUFF","CALCITE","DRIPSTONE_BLOCK","OBSIDIAN","CRYING_OBSIDIAN","NETHERRACK","SOUL_SAND","SOUL_SOIL","BASALT","BLACKSTONE","END_STONE","PURPUR_BLOCK","GLOWSTONE","SEA_LANTERN","SHROOMLIGHT","OCHRE_FROGLIGHT","VERDANT_FROGLIGHT","PEARLESCENT_FROGLIGHT"].forEach(s => add(s));

    // 9. Nature
    ["GRASS_BLOCK","DIRT","COARSE_DIRT","PODZOL","MYCELIUM","SAND","RED_SAND","GRAVEL","CLAY","ICE","PACKED_ICE","BLUE_ICE","SNOW_BLOCK","CACTUS","SUGAR_CANE","PUMPKIN","MELON","LILY_PAD","VINE","GLOW_LICHEN"].forEach(n => add(n));

    // 10. Admin
    ["BARRIER","COMMAND_BLOCK","STRUCTURE_VOID","LIGHT","DEBUG_STICK"].forEach(a => add(a));

    // --- 2. STATE ---
    let state = {
        slots: {},
        selectedSlot: null,
        brush: null,
        size: 54,
        isPainting: false,
        dragSrc: null
    };

    // --- 3. LOGIC ---
    
    function init() {
        // Render only first 100 initially to prevent lag
        renderPalette(''); 
        renderGrid();
        updateCode();
        
        // Debounce Search
        const searchInput = document.getElementById('search-input');
        let timeout = null;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                renderPalette(e.target.value);
            }, 300); // 300ms delay
        });
    }

    // --- TEXTURE LOADER (THE FIX) ---
    // Try item folder first. If error, switch to block folder.
    function createSmartImage(item) {
        const img = document.createElement('img');
        // Initial Try: Item folder
        img.src = `${ASSET_BASE}/item/${item.name}.png`;
        img.onerror = function() {
            // Second Try: Block folder
            this.onerror = null; // Prevent infinite loop
            this.src = `${ASSET_BASE}/block/${item.name}.png`;
            // If block fails, try checking for _side naming convention common in blocks
            this.onerror = function() {
                this.src = `${ASSET_BASE}/block/${item.name}_side.png`;
                // Final fallback
                this.onerror = function() {
                    this.src = "https://assets.mcasset.cloud/1.20.1/assets/minecraft/textures/item/barrier.png";
                }
            }
        };
        return img;
    }

    function renderPalette(filter) {
        const grid = document.getElementById('palette-grid');
        grid.innerHTML = '';
        
        const term = filter.toUpperCase().replace(/ /g, '_');
        let count = 0;
        const LIMIT = 150; // Performance Cap

        for (let item of ITEM_DB) {
            if (term && !item.id.includes(term)) continue;
            
            // Hard limit on visible items to stop lag
            if (!term && count > LIMIT) break; 
            if (term && count > 300) break; // Allow more results if searching

            const div = document.createElement('div');
            div.className = 'palette-item';
            if(state.brush && state.brush.id === item.id) div.classList.add('active-brush');
            div.onclick = () => setBrush(item);
            div.title = item.id;
            
            div.appendChild(createSmartImage(item));
            grid.appendChild(div);
            count++;
        }
        
        document.getElementById('loading-msg').innerText = count > LIMIT && !term ? `Showing top ${LIMIT} items (Use search for more)` : `${count} items found`;
    }

    function setBrush(item) {
        state.brush = item;
        const display = document.getElementById('brush-display');
        
        // Update UI highlight
        document.querySelectorAll('.palette-item').forEach(el => el.classList.remove('active-brush'));

        if(item) {
            display.innerHTML = `<img src="${ASSET_BASE}/item/${item.name}.png" onerror="this.src='${ASSET_BASE}/block/${item.name}.png'" style="width:24px;height:24px;"> <span style="color:var(--amethyst)">${item.id}</span>`;
        } else {
            display.innerHTML = `<span style="color:var(--amethyst); font-weight:bold;">CURSOR</span> (Drag Mode)`;
        }
    }

    // --- GRID SYSTEM ---
    function setGridSize(n) { state.size = n; renderGrid(); updateCode(); }

    function renderGrid() {
        const grid = document.getElementById('gui-grid');
        grid.innerHTML = '';

        for(let i=0; i<state.size; i++) {
            const slot = document.createElement('div');
            slot.className = 'gui-slot';
            if(state.selectedSlot === i) slot.classList.add('selected');

            if(state.slots[i]) {
                slot.appendChild(createSmartImage(state.slots[i]));
            }

            // MOUSE EVENTS
            slot.onmousedown = (e) => {
                if(e.button === 0) {
                    if(state.brush) {
                        state.isPainting = true;
                        applyBrush(i);
                    } else if(state.slots[i]) {
                        // Start Drag (Native API wrapper)
                        slot.draggable = true;
                    }
                    selectSlot(i);
                }
            };
            
            slot.onmouseenter = (e) => {
                if(state.isPainting && state.brush) {
                    applyBrush(i);
                    selectSlot(i);
                }
                if(state.slots[i]) showTooltip(e, i);
            };

            slot.onmouseleave = () => {
                document.getElementById('mc-tooltip').style.display = 'none';
            };

            slot.oncontextmenu = (e) => {
                e.preventDefault();
                delete state.slots[i];
                if(state.selectedSlot === i) selectSlot(null);
                renderGrid();
                updateCode();
            };

            // Drag & Drop Logic (Native)
            if(!state.brush) {
                slot.ondragstart = (e) => {
                    state.dragSrc = i;
                    document.getElementById('mc-tooltip').style.display = 'none';
                };
                slot.ondragover = (e) => e.preventDefault();
                slot.ondrop = (e) => {
                    e.preventDefault();
                    if(state.dragSrc === null) return;
                    // Swap
                    let temp = state.slots[i];
                    state.slots[i] = state.slots[state.dragSrc];
                    if(temp) state.slots[state.dragSrc] = temp; 
                    else delete state.slots[state.dragSrc];
                    
                    state.dragSrc = null;
                    renderGrid();
                    updateCode();
                };
            }

            grid.appendChild(slot);
        }
    }

    function applyBrush(i) {
        state.slots[i] = { id: state.brush.id, name: state.brush.name, displayName: '', lore: '' };
        renderGrid();
        updateCode();
    }
    
    function endPaint() { state.isPainting = false; }

    function selectSlot(i) {
        state.selectedSlot = i;
        const slots = document.querySelectorAll('.gui-slot');
        slots.forEach(s => s.classList.remove('selected'));
        if(i !== null && slots[i]) slots[i].classList.add('selected');
        
        // Update Props Panel
        const data = (i !== null) ? state.slots[i] : null;
        document.getElementById('prop-mat').value = data ? data.id : '';
        document.getElementById('prop-name').value = data ? data.displayName : '';
        document.getElementById('prop-lore').value = data ? data.lore : '';
    }

    function updateSlotData() {
        if(state.selectedSlot === null || !state.slots[state.selectedSlot]) return;
        const s = state.slots[state.selectedSlot];
        s.displayName = document.getElementById('prop-name').value;
        s.lore = document.getElementById('prop-lore').value;
        updateCode();
    }
    
    function deleteSlot() {
        if(state.selectedSlot !== null) {
            delete state.slots[state.selectedSlot];
            selectSlot(null);
            renderGrid();
            updateCode();
        }
    }

    // --- TOOLTIP & COLORS ---
    const MC_COLORS = {'0':'#000','1':'#00a','2':'#0a0','3':'#0aa','4':'#a00','5':'#a0a','6':'#fa0','7':'#aaa','8':'#555','9':'#55f','a':'#5f5','b':'#5ff','c':'#f55','d':'#f5f','e':'#ff5','f':'#fff'};
    
    function parseColors(text) {
        if(!text) return '';
        let parts = text.split(/(&[0-9a-f])/g);
        let color = '#fff';
        let html = '';
        parts.forEach(p => {
            if(p.startsWith('&') && MC_COLORS[p[1]]) color = MC_COLORS[p[1]];
            else html += `<span style="color:${color}">${p}</span>`;
        });
        return html;
    }

    function showTooltip(e, i) {
        const d = state.slots[i];
        if(!d) return;
        const tt = document.getElementById('mc-tooltip');
        
        let title = d.displayName ? parseColors(d.displayName) : `<span style="color:#5ff">${d.name.replace(/_/g,' ')}</span>`;
        let lore = d.lore ? d.lore.split('\n').map(l => `<div>${parseColors(l)}</div>`).join('') : '';

        tt.innerHTML = `<div style="text-transform:capitalize; margin-bottom:4px; text-shadow:1px 1px 0 #000;">${title}</div><div style="color:#aaa; text-shadow:1px 1px 0 #000;">${lore}</div>`;
        tt.style.display = 'block';
        tt.style.left = (e.clientX + 15) + 'px';
        tt.style.top = (e.clientY + 15) + 'px';
    }

    // --- JAVA GEN ---
    function updateCode() {
        const title = document.getElementById('gui-title').value;
        let c = `public void openGui(Player player) {\n    Inventory inv = Bukkit.createInventory(null, ${state.size}, "${title}");\n\n`;
        
        for(let i=0; i<state.size; i++) {
            if(state.slots[i]) {
                const s = state.slots[i];
                c += `    ItemStack item${i} = new ItemStack(Material.${s.id});\n`;
                c += `    ItemMeta meta${i} = item${i}.getItemMeta();\n`;
                if(s.displayName) c += `    meta${i}.setDisplayName("${s.displayName.replace(/&/g,'§')}");\n`;
                if(s.lore) {
                    const l = s.lore.split('\n').map(x => `"${x.replace(/&/g,'§')}"`).join(',');
                    c += `    meta${i}.setLore(Arrays.asList(${l}));\n`;
                }
                c += `    item${i}.setItemMeta(meta${i});\n`;
                c += `    inv.setItem(${i}, item${i});\n\n`;
            }
        }
        c += `    player.openInventory(inv);\n}`;
        document.getElementById('code-output').innerText = c;
    }

    function copyCode() {
        navigator.clipboard.writeText(document.getElementById('code-output').innerText);
        alert("Copied!");
    }

    // Init
    init();
</script>
</body>
</html>
