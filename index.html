<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>End-Tier GUI Architect v2</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian: #0d0714;
            --amethyst: #9966cc;
            --void-purp: #2d1b4d;
            --end-rod: #e0d0f0;
            --mc-gui: #c6c6c6;
            --mc-border-dark: #373737;
            --mc-border-light: #ffffff;
            --mc-highlight: #8b8b8b;
        }

        * { box-sizing: border-box; }

        body {
            background: radial-gradient(circle at center, #1a0f2e 0%, var(--obsidian) 100%);
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            padding: 20px;
            margin: 0;
            height: 100vh;
            overflow: hidden; /* App-like feel */
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            color: var(--amethyst);
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #000;
        }

        /* Main Layout */
        .editor-container {
            display: grid;
            grid-template-columns: 280px 1fr 300px; /* Sidebar | Canvas | Properties */
            gap: 20px;
            height: calc(100vh - 80px);
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Panels */
        .panel {
            background: rgba(45, 27, 77, 0.9);
            border: 2px solid var(--amethyst);
            display: flex;
            flex-direction: column;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .panel-header {
            background: var(--amethyst);
            color: #000;
            padding: 10px;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            text-align: center;
            font-weight: bold;
        }

        .panel-content {
            padding: 15px;
            overflow-y: auto;
            flex: 1;
        }

        /* ITEM PALETTE (Left) */
        .search-bar {
            width: 100%;
            background: #000;
            border: 1px solid var(--amethyst);
            color: #fff;
            padding: 8px;
            margin-bottom: 10px;
            font-family: inherit;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 5px;
        }

        .palette-item {
            width: 100%;
            aspect-ratio: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
        }

        .palette-item:hover {
            border-color: var(--end-rod);
            background: rgba(255,255,255,0.1);
        }

        .palette-item img {
            width: 32px;
            height: 32px;
            image-rendering: pixelated;
        }

        /* GUI CANVAS (Center) */
        .canvas-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }

        .gui-frame {
            background: var(--mc-gui);
            padding: 10px;
            border: 4px solid var(--mc-border-dark);
            border-radius: 2px;
            box-shadow: 10px 10px 20px rgba(0,0,0,0.5);
        }

        #gui-grid {
            display: grid;
            grid-template-columns: repeat(9, 50px);
            gap: 4px; /* Minecraft standard gap */
        }

        .gui-slot {
            width: 50px;
            height: 50px;
            background: #8b8b8b;
            border: 2px solid;
            border-color: #373737 #fff #fff #373737;
            position: relative;
            cursor: pointer;
        }

        .gui-slot:hover {
            background: #a0a0a0;
        }

        .gui-slot.selected {
            outline: 3px solid var(--amethyst);
            z-index: 10;
        }

        .gui-slot img {
            width: 40px;
            height: 40px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            image-rendering: pixelated;
            pointer-events: none;
        }

        /* PROPERTIES (Right) */
        label { display: block; margin: 10px 0 5px; font-size: 12px; color: var(--end-rod); }
        
        input, textarea, select {
            width: 100%;
            background: #111;
            border: 1px solid #555;
            color: #fff;
            padding: 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        input:focus, textarea:focus {
            border-color: var(--amethyst);
            outline: none;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            background: var(--amethyst);
            border: none;
            color: white;
            padding: 10px;
            flex: 1;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            transition: 0.2s;
        }

        button:hover { filter: brightness(1.2); }
        button.secondary { background: #555; }
        button.danger { background: #cc4444; }

        /* Code Block */
        .code-preview {
            margin-top: 20px;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 4px;
            font-size: 11px;
            height: 200px;
            overflow: auto;
            white-space: pre;
            color: #d4d4d4;
            border: 1px solid #333;
        }
        
        .code-keyword { color: #c586c0; }
        .code-string { color: #ce9178; }
        .code-comment { color: #6a9955; }
        .code-class { color: #4ec9b0; }

    </style>
</head>
<body>

<h1>GUI Architect v2.0</h1>

<div class="editor-container">
    
    <div class="panel">
        <div class="panel-header">Item Repository</div>
        <div class="panel-content">
            <input type="text" class="search-bar" placeholder="Search items..." id="search-input" onkeyup="filterPalette()">
            <div class="palette-grid" id="palette-grid">
                </div>
        </div>
    </div>

    <div class="canvas-area">
        <div style="margin-bottom: 15px;">
            <input type="text" id="gui-title" value="Menu Title" style="text-align: center; font-size: 16px; width: 300px; background: transparent; border: none; border-bottom: 2px solid var(--amethyst);">
        </div>
        
        <div class="gui-frame">
            <div id="gui-grid"></div>
        </div>

        <div class="btn-group" style="width: 300px;">
            <button onclick="setGridSize(27)">3 Rows</button>
            <button onclick="setGridSize(54)">6 Rows</button>
        </div>
        <p style="margin-top:10px; font-size: 12px; color: #888;">Current Brush: <strong id="active-brush" style="color:var(--amethyst)">None</strong></p>
    </div>

    <div class="panel">
        <div class="panel-header">Slot Properties</div>
        <div class="panel-content">
            <div id="prop-controls">
                <label>Material</label>
                <input type="text" id="prop-mat" readonly style="color: #888;">

                <label>Display Name (& codes supported)</label>
                <input type="text" id="prop-name" placeholder="&dExcalibur" oninput="updateSlotData()">

                <label>Lore (Lines)</label>
                <textarea id="prop-lore" rows="5" placeholder="&7A legendary sword..." oninput="updateSlotData()"></textarea>

                <div class="btn-group">
                    <button class="danger" onclick="clearSelectedSlot()">Clear</button>
                </div>
            </div>

            <label style="margin-top: 20px;">Generated Java Code</label>
            <div class="code-preview" id="code-output"></div>
            <button onclick="copyCode()" style="margin-top: 10px;">Copy Code</button>
        </div>
    </div>

</div>

<script>
    // --- DATA ---
    // Using a stable CDN for images. 'type' helps us build the URL correctly.
    // block = textures/block, item = textures/item
    const DB = [
        // TOOLS & WEAPONS
        { id: 'DIAMOND_SWORD', type: 'item', name: 'diamond_sword' },
        { id: 'NETHERITE_SWORD', type: 'item', name: 'netherite_sword' },
        { id: 'DIAMOND_PICKAXE', type: 'item', name: 'diamond_pickaxe' },
        { id: 'BOW', type: 'item', name: 'bow' },
        { id: 'ARROW', type: 'item', name: 'arrow' },
        { id: 'SHIELD', type: 'item', name: 'shield' },
        { id: 'TRIDENT', type: 'item', name: 'trident' },
        
        // ARMOR
        { id: 'DIAMOND_HELMET', type: 'item', name: 'diamond_helmet' },
        { id: 'DIAMOND_CHESTPLATE', type: 'item', name: 'diamond_chestplate' },
        { id: 'NETHERITE_CHESTPLATE', type: 'item', name: 'netherite_chestplate' },
        { id: 'ELYTRA', type: 'item', name: 'elytra' },

        // ORES & BLOCKS
        { id: 'DIAMOND_ORE', type: 'block', name: 'diamond_ore' },
        { id: 'GOLD_ORE', type: 'block', name: 'gold_ore' },
        { id: 'IRON_ORE', type: 'block', name: 'iron_ore' },
        { id: 'EMERALD_ORE', type: 'block', name: 'emerald_ore' },
        { id: 'AMETHYST_BLOCK', type: 'block', name: 'amethyst_block' },
        { id: 'BEDROCK', type: 'block', name: 'bedrock' },
        { id: 'OAK_LOG', type: 'block', name: 'oak_log' },
        { id: 'COBBLESTONE', type: 'block', name: 'cobblestone' },
        { id: 'CHEST', type: 'block', name: 'chest_inventory', specialUrl: true }, // Chest texture is tricky, using inv icon
        { id: 'ENDER_CHEST', type: 'block', name: 'ender_chest_inventory', specialUrl: true },
        { id: 'BEACON', type: 'block', name: 'beacon' },
        { id: 'TNT', type: 'block', name: 'tnt_side' },

        // ITEMS
        { id: 'DIAMOND', type: 'item', name: 'diamond' },
        { id: 'GOLD_INGOT', type: 'item', name: 'gold_ingot' },
        { id: 'IRON_INGOT', type: 'item', name: 'iron_ingot' },
        { id: 'EMERALD', type: 'item', name: 'emerald' },
        { id: 'NETHER_STAR', type: 'item', name: 'nether_star' },
        { id: 'ENDER_PEARL', type: 'item', name: 'ender_pearl' },
        { id: 'BLAZE_ROD', type: 'item', name: 'blaze_rod' },
        { id: 'TOTEM_OF_UNDYING', type: 'item', name: 'totem_of_undying' },
        
        // FOOD
        { id: 'GOLDEN_APPLE', type: 'item', name: 'golden_apple' },
        { id: 'COOKED_BEEF', type: 'item', name: 'cooked_beef' },
        { id: 'BREAD', type: 'item', name: 'bread' },
        { id: 'POTION', type: 'item', name: 'potion' },
        
        // UTILITY
        { id: 'PAPER', type: 'item', name: 'paper' },
        { id: 'BOOK', type: 'item', name: 'book' },
        { id: 'NAME_TAG', type: 'item', name: 'name_tag' },
        { id: 'BARRIER', type: 'item', name: 'barrier' },
        { id: 'HOPPER', type: 'item', name: 'hopper' },
    ];

    // Using a reliable raw asset source (MC Assets by PrismarineJS or similar)
    const ASSET_BASE = "https://assets.mcasset.cloud/1.20.1/assets/minecraft/textures";

    let state = {
        slots: {}, // { index: { id, name, lore } }
        selectedSlot: null,
        brush: null,
        size: 54
    };

    // --- INITIALIZATION ---
    function init() {
        renderPalette();
        renderGrid();
        updateCode();
    }

    function getImageUrl(item) {
        // Handle special cases or standard paths
        if(item.specialUrl) {
             // Some blocks like chests are rendered differently, mapping to a generic 2d icon if possible
             // For simplicity in this demo, we use specific known paths or fallbacks
             return `${ASSET_BASE}/item/${item.name}.png`; // Try item folder for inv icons first
        }
        return `${ASSET_BASE}/${item.type}/${item.name}.png`;
    }

    // --- PALETTE ---
    function renderPalette() {
        const grid = document.getElementById('palette-grid');
        grid.innerHTML = '';
        
        const filter = document.getElementById('search-input').value.toLowerCase();

        DB.forEach(item => {
            if (!item.id.toLowerCase().includes(filter)) return;

            const div = document.createElement('div');
            div.className = 'palette-item';
            div.title = item.id;
            div.onclick = () => selectBrush(item);
            
            const img = document.createElement('img');
            img.src = getImageUrl(item);
            img.onerror = () => { img.src = 'https://assets.mcasset.cloud/1.20.1/assets/minecraft/textures/item/barrier.png'; }; // Fallback

            div.appendChild(img);
            grid.appendChild(div);
        });
    }

    function filterPalette() {
        renderPalette();
    }

    function selectBrush(item) {
        state.brush = item;
        document.getElementById('active-brush').innerText = item.id;
    }

    // --- GRID CANVAS ---
    function setGridSize(s) {
        state.size = s;
        renderGrid();
        updateCode();
    }

    function renderGrid() {
        const grid = document.getElementById('gui-grid');
        grid.innerHTML = '';
        
        // Update Grid Size visually
        const rows = state.size / 9;
        // height of slot (50) + gap (4)
        const height = (rows * 54); 
        
        for(let i=0; i<state.size; i++) {
            const slot = document.createElement('div');
            slot.className = 'gui-slot';
            if(state.selectedSlot === i) slot.classList.add('selected');
            
            slot.onclick = () => clickSlot(i);

            // Render content if exists
            if(state.slots[i]) {
                const itemData = DB.find(x => x.id === state.slots[i].id);
                if(itemData) {
                    const img = document.createElement('img');
                    img.src = getImageUrl(itemData);
                    slot.appendChild(img);
                }
            }

            grid.appendChild(slot);
        }
    }

    function clickSlot(index) {
        // If brush is active, paint
        if(state.brush) {
            state.slots[index] = { 
                id: state.brush.id, 
                name: '', 
                lore: '' 
            };
            state.brush = null; // Consume brush (optional: comment out to keep painting)
            document.getElementById('active-brush').innerText = "None";
            renderGrid();
        }
        
        // Select logic
        state.selectedSlot = index;
        renderGrid(); // Redraw to show selection outline
        loadProperties(index);
    }

    // --- PROPERTIES & LOGIC ---
    function loadProperties(index) {
        const data = state.slots[index];
        if(!data) {
            document.getElementById('prop-mat').value = "AIR";
            document.getElementById('prop-name').value = "";
            document.getElementById('prop-lore').value = "";
        } else {
            document.getElementById('prop-mat').value = data.id;
            document.getElementById('prop-name').value = data.name;
            document.getElementById('prop-lore').value = data.lore;
        }
    }

    function updateSlotData() {
        if(state.selectedSlot === null || !state.slots[state.selectedSlot]) return;
        
        state.slots[state.selectedSlot].name = document.getElementById('prop-name').value;
        state.slots[state.selectedSlot].lore = document.getElementById('prop-lore').value;
        updateCode();
    }

    function clearSelectedSlot() {
        if(state.selectedSlot === null) return;
        delete state.slots[state.selectedSlot];
        renderGrid();
        loadProperties(state.selectedSlot);
        updateCode();
    }

    // --- CODE GENERATION ---
    function updateCode() {
        const title = document.getElementById('gui-title').value;
        let c = `<span class="code-keyword">public void</span> <span class="code-class">openGui</span>(Player player) {\n`;
        c += `    Inventory inv = Bukkit.createInventory(<span class="code-keyword">null</span>, ${state.size}, <span class="code-string">"${title}"</span>);\n\n`;

        // Loop through slots
        for(let i=0; i<state.size; i++) {
            if(state.slots[i]) {
                const s = state.slots[i];
                c += `    <span class="code-comment">// Slot ${i}</span>\n`;
                c += `    ItemStack item${i} = <span class="code-keyword">new</span> ItemStack(Material.${s.id});\n`;
                c += `    ItemMeta meta${i} = item${i}.getItemMeta();\n`;
                
                if(s.name) {
                    c += `    meta${i}.setDisplayName(<span class="code-string">"${s.name.replace(/&/g, '§')}"</span>);\n`;
                }
                
                if(s.lore) {
                    const lines = s.lore.split('\n').map(l => `"<span class="code-string">${l.replace(/&/g, '§')}</span>"`).join(', ');
                    c += `    meta${i}.setLore(Arrays.asList(${lines}));\n`;
                }

                c += `    item${i}.setItemMeta(meta${i});\n`;
                c += `    inv.setItem(${i}, item${i});\n\n`;
            }
        }
        
        c += `    player.openInventory(inv);\n}`;
        document.getElementById('code-output').innerHTML = c;
    }

    function copyCode() {
        const text = document.getElementById('code-output').innerText;
        navigator.clipboard.writeText(text);
        alert("Java Code Copied!");
    }

    init();

</script>
</body>
</html>
